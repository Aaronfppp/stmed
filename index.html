<style>

me{font-weight:800;font-size:23px;letter-spacing:-.05em;line-height:1}.branddesc{font-size:11px;color:#aec3c6;margin-top:5px}.side .eyebrow{color:#89aaa9;padding:0 10px}.nav{display:grid;gap:4px}.nav button{color:var(--navtext);border:0;background:transparent;text-align:left;padding:11px 12px;display:flex;align-items:center;gap:10px;font-weight:550;width:100%;border-radius:8px}.nav button:hover,.nav button.active{color:white;background:#ffffff15}.nav button.active{box-shadow:inset 3px 0 #8fdbc8}.nav .ni{width:23px;text-align:center;opacity:.9;font-size:18px}.side a{color:#c0dfd6}.sidefooter{border-top:1px solid #ffffff23;padding:14px 9px;margin-top:auto;color:#aac2c5;font-size:12px}.main{min-width:0}.top{position:sticky;top:0;z-index:12;background:#f4f6f3ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 28px;gap:14px}.crumb{font-size:13px;color:var(--sub)}.crumb b{color:var(--ink)}.topright{display:flex;gap:10px;align-items:center}.content{max-width:1240px;margin:auto;padding:30px 30px 64px}.section{margin-top:26px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0}.hero{background:#153c43;color:#f2f8f4;border-radius:20px;padding:28px;display:grid;grid-template-columns:1.3fr .7fr;gap:24px;overflow:hidden;position:relative}.hero .eyebrow{color:#95dbc9}.hero p{color:#d0e3df;max-width:600px;margin-top:12px}.hero .primary{background:#d3eee2;color:#163d3a;border-color:#d3eee2}.heroart{align-self:center;display:grid;gap:9px}.heroart .milestone{display:flex;gap:12px;align-items:center;border:1px solid #ffffff24;border-radius:12px;background:#ffffff09;padding:12px 15px}. ay:grid;grid-template-columns:minmax(0,1fr) 275px;align-items:start;gap:18px}.studybody{min-width:0}.studyrail{position:sticky;top:80px;display:grid;gap:12px}.studyrail .lessonlink{font-size:13px;padding:9px 10px}.studyrail .current{background:var(--accent2);border-color:#97cdbb}.intro{font-size:16px;color:#425a60;margin:12px 0 18px;line-height:1.75}.point{padding:17px 0;border-top:1px solid var(--line)}.point:first-of-type{border-top:0}.point h3{margin-bottom:6px;font-size:16px;color:#1a544e}.point p{line-height:1.72}.memorytip{padding:14px 16px;border:1px solid #beded0;border-radius:10px;background:#edf6f0;margin-top:14px}.memorytip b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:6px}.ref{font-size:12px;color:var(--sub);line-height:1.6}.ref a{color:var(--accent)}.sequence{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px}.step{border:1px solid #c6dcd2;border-radius:8px;background:#f5faf7;padding:7px 10px;font-size:13px}.arrow{color:var(--accent);font-weight:800}.config{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.fieldwrap label{display:block;margin-bottom:6px;font-weight:700;font-size:13px}.qpanel{max-width:870px;margin:16px auto}.qhead{display:flex;gap:12px;align-items:center;justify-content:space-between}.qstem{font-size:clamp(19px,2.4vw,26px);font-weight:750;line-height:1.4;margin:18px 0}.options{display:grid;gap:10px}.option{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-weight:550;padding:14px;border-radius:10px;min-height:55px}.option .letter{display:grid;place-items:center;width:28px;height:28px;background:#edf1ee;border-radius:7px;flex:0 0 28px;font-weight:700;font-size:13px}.option.chosen{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent2)}.option.right{border-color:#4caa82;background:#eaf7ef;color:var(--good)}.option.wrong{border-color:#c2696e;background:var(--badbg);color:var(--bad)}.feedback{padding:14px;border-radius:10px;background:#f0f4f1;margin-top:14px}.feedback.right{background:#eaf7ef;color:var(--good)}.feedback.wrong{background:var(--badbg);color:var(--bad)}.resultline{border-top:1px solid var(--line);padding:14px 0}.resultline:first-of-type{border-top:0}.resultline h3{margin-bottom:6px;font-size:15px}.resultline p{font-size:13px;margin:5px 0}.bigscore{font-size:49px;line-height:1.1;font-weight:850;letter-spacing:-.045em}.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:15px;padding:28px}.flash .qstem{margin:0}.flashanswer{font-weight:750;font-size:23px;color:var(--accent)}.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.seqanswer{min-height:56px;border:1px dashed #a2b8b2;border-radius:10px;padding:12px;margin:12px 0;display:flex;flex-wrap:wrap;gap:7px}.seqanswer span{padding:7px 10px;background:var(--accent2);border-radius:7px;font-size:13px}.sourceitem{padding:13px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.sourceitem:last-child{border:0}.sourceitem ul{margin:6px 0;padding-left:20px}.sourceitem li{font-size:13px;margin:3px 0}.hidden{display:none!important}.mobilebrand{display:none}.mobilemenu{display:none}.footnote{color:var(--sub);font-size:12px;margin-top:22px}.pillstat{font-size:12px;color:var(--sub);white-space:nowrap}.empty{padding:30px;text-align:center;color:var(--sub)}.spacer{flex:1}.checklist{display:grid;gap:8px;margin:12px 0}.checklist label{display:flex;align-items:flex-start;gap:8px;font-size:14px}.checklist input{accent-color:var(--accent);width:17px;height:17px;margin-top:3px}.recallanswer{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.top progress{width:90px;accent-color:var(--accent)}

<div class="layout"><aside class="side" id="side"><div class="brand"><div class="brandmark">T</div><div><div class="brandname">Trama</div><div class="branddesc">TEORÍA MÉDICA · BLOQUE 02</div></div></div><div><div class="eyebrow">Estudio</div><nav class="nav" id="nav"></nav></div><div><div class="eyebrow">Materias</div><div class="nav"><button data-act="modules" class="active"><span class="ni">◉</span>Embriología</button><button disabled><span class="ni">○</span>Bioquímica · pendiente</button><button disabled><span class="ni">○</span>Histología · pendiente</button><button disabled><span class="ni">○</span>Anatomía · pendiente</button></div></div><div class="sidefooter">Versión 1 · solo Embriología<br>Sin imágenes pesadas ni conexión requerida.<br><a href="https://lamina-anato-histo-aaron.aaron-afpppp.chatgpt.site/" target="_blank" rel="noopener">Ir al atlas visual Lámina ↗</a></div></aside><main class="main"><header class="top"><button class="mobilemenu" data-act="menu" aria-label="Abrir menú">☰</button><div class="crumb" id="crumb">Embriología</div><div class="topright"><span class="pillstat" id="topstat"></span><button data-act="priority" class="primary">Ojo + oído</button></div></header><div id="app" class="content"></div></main></div>
<script id="data" type="application/json">{"modules": [{"id": "seg", "title": "Segmentación e implantación", "sub": "Primera y segunda semanas · antecedentes", "priority": false, "icon": "01", "lessons": [{"id": "seg1", "title": "Del cigoto a la mórula", "refs": [["seg", 1, 2, 1, 6]], "intro": "La segmentación multiplica el número de células sin aumentar proporcionalmente el volumen del conjunto, mientras el embrión permanece rodeado por la zona pelúcida. El profesor describe cinco características y hace énfasis en que no todas las blastómeras se dividen al mismo tiempo.", "points": [{"title": "Holoblástica", "body": "La división abarca por completo la célula; las primeras divisiones forman blastómeras separadas. Las etapas iniciales se describen como totipotenciales."}, {"title": "Rotacional", "body": "Los planos de división cambian entre longitudinales y ecuatoriales. En el dibujo de clase, las divisiones iniciales y las siguientes se ilustran con planos diferentes."}, {"title": "Asincrónica y asimétrica", "body": "Los tiempos no son iguales y las blastómeras pueden tener tamaños distintos. El ejemplo docente usa unas 36 horas para las primeras dos células y luego intervalos variables, no un reloj universal."}, {"title": "Aberrante", "body": "Término del pizarrón y de la transcripción (p. 2): la secuencia de número celular puede avanzar de uno en uno, no siempre en potencias de dos."}, {"title": "Compactación y mórula", "body": "Alrededor del estadio de ocho células aumenta el contacto entre blastómeras. A las 16 células el profesor denomina mórula al conjunto compacto."}], "tip": "8: compactación; 16: mórula. Asincronía = tiempo; asimetría = tamaño.", "sequence": ["Cigoto", "Blastómeras", "Compactación (≈8)", "Mórula (≈16)", "Blastocisto"], "alert": null}, {"id": "seg2", "title": "Blastocisto, zona pelúcida e implantación", "refs": [["seg", 1, 4, 3, 12]], "intro": "La cavitación crea un espacio dentro de la mórula. La distribución de las células internas y externas define dos poblaciones con destinos diferentes.", "points": [{"title": "Cavitación", "body": "Según la explicación de clase, el transporte iónico asociado con Na⁺/K⁺ y el movimiento de agua permiten generar el blastocele. La masa interna es el embrioblasto y la externa es el trofoblasto."}, {"title": "Potencialidad", "body": "Las blastómeras tempranas se describen como totipotenciales; el embrioblasto del blastocisto, como pluripotencial. OCT4 y NANOG se relacionan con mantenimiento de pluripotencialidad."}, {"title": "Zona pelúcida", "body": "ZP1, ZP2, ZP3 y ZP4. Evita implantación antes de la eclosión y participa en la fecundación. El docente contrasta el reconocimiento clásico por ZP3 con ZP2 en literatura que considera más reciente."}, {"title": "Eclosión", "body": "Pérdida de la zona pelúcida al final de la primera semana; en clase se usa día 5–7 como intervalo. El blastocisto puede entonces implantarse."}, {"title": "Implantación", "body": "El endometrio secretor es el contexto de implantación; se menciona el fondo uterino posterior. Una implantación fuera de la cavidad uterina puede ser ectópica (frecuentemente tubárica)."}], "tip": "Embrioblasto → embrión; trofoblasto → contribución placentaria. No intercambies los destinos.", "sequence": null, "alert": "El profesor distingue ZP2 de ZP3 según el texto utilizado. No conviertas las afirmaciones de protección inmunológica absoluta ni una sola causa de embarazo ectópico de la transcripción en reglas clínicas."}, {"id": "seg3", "title": "Gemelismo y ejes iniciales", "refs": [["seg", 3, 4, 18, 24], ["rep", 2, 2, 1, 3]], "intro": "El número de cigotos y el momento de separación son dos datos distintos. La organización de los ejes, por otra parte, permite comprender la lateralidad del embrión.", "points": [{"title": "Dicigóticos", "body": "Se originan de dos ovocitos fecundados de manera independiente por dos espermatozoides. Cada uno tiene su propio genotipo y sus membranas correspondientes."}, {"title": "Monocigóticos", "body": "Un cigoto origina dos embriones. Una separación temprana puede dar dos unidades coriales; una separación del embrioblasto puede compartir el componente placentario. El modelo de clase vincula la separación incompleta con gemelos unidos."}, {"title": "Ejes", "body": "El epiblasto es dorsal y el hipoblasto ventral. La línea primitiva se extiende desde la región caudal hacia la craneal."}, {"title": "Lateralidad", "body": "El repaso menciona la cascada NODAL, LEFTY1/LEFTY2 y PITX2 del lado izquierdo, con participación de serotonina. Una alteración del patrón se relaciona con situs inversus."}], "tip": "Di = dos cigotos. Mono = un cigoto; no significa necesariamente una sola placenta.", "sequence": null, "alert": "El profesor indicó en el repaso del 20 de noviembre (transcripción pp. 28–29) que el departamental empieza desde gastrulación. Segmentación queda como antecedente y se excluye por defecto del simulacro DEPA."}]}, {"id": "gas", "title": "Gastrulación y mesodermo", "sub": "Segunda a tercera semana · muy preguntado", "priority": true, "icon": "02", "lessons": [{"id": "gas1", "title": "Disco bilaminar, línea primitiva y cavidades", "refs": [["gas", 1, 3, 1, 6], ["rep", 1, 2, 1, 5]], "intro": "La segunda semana se caracteriza por un disco bilaminar. La aparición de la línea primitiva al inicio de la tercera semana permite la migración que formará el disco trilaminar.", "points": [{"title": "Epiblasto e hipoblasto", "body": "Epiblasto dorsal; hipoblasto ventral. La cavidad amniótica se ubica dorsalmente y el espacio vitelino ventralmente. El profesor distingue el blastocele antes de su recubrimiento."}, {"title": "Línea y nódulo", "body": "La línea primitiva es la región longitudinal de migración en el epiblasto; el nódulo de Hensen se encuentra en su extremo craneal. No es sinónimo de notocorda: por él ingresan células que contribuyen a formarla."}, {"title": "Membranas", "body": "Orofaríngea o bucofaríngea (cefálica) y cloacal (caudal) delimitan los extremos. En el modelo docente no contienen mesodermo interpuesto."}, {"title": "Adhesión celular", "body": "CAMs/cadherinas mantienen unidas las células. Durante el ingreso por la línea se reduce la adhesión y cambia la forma celular; el repaso describe células en botella y células mesenquimatosas."}, {"title": "Destino del hipoblasto", "body": "Contribuye al endodermo extraembrionario que reviste el saco vitelino. No es el origen del endodermo definitivo del embrión."}], "tip": "Epiblasto = las tres capas embrionarias. Hipoblasto = revestimiento extraembrionario del saco vitelino.", "sequence": null, "alert": null}, {"id": "gas2", "title": "Movimientos morfogenéticos y tres capas", "refs": [["gas", 2, 4, 3, 11], ["rep", 1, 3, 4, 8]], "intro": "El profesor utiliza nombres específicos de movimientos para explicar cómo se pasa de una cavidad o una capa a otra. Aprende qué hace la célula y qué estructura resulta, no solo el término.", "points": [{"title": "Cavitación, endobolia y epibolia", "body": "Cavitación = crear cavidad. Endobolia, según la terminología docente, = recubrir una cavidad ya formada. Epibolia = extender células sobre una cubierta existente; se usa en clase para el mesodermo extraembrionario."}, {"title": "Convergencia e invaginación", "body": "La primera lleva células desde la periferia a un punto común; la segunda introduce o pliega tejido hacia el interior."}, {"title": "Divergencia e involución", "body": "Divergencia = de un punto común hacia la periferia. Involución = convergencia, invaginación y divergencia (secuencia usada para formar mesodermo)."}, {"title": "Poliinvaginación", "body": "Invaginaciones sucesivas del epiblasto que reemplazan al hipoblasto en el esquema de formación del endodermo definitivo."}, {"title": "Gastrulación", "body": "Todas las capas definitivas vienen del epiblasto: las células que permanecen superficialmente se convierten en ectodermo, las que migran entre capas forman mesodermo y las que sustituyen el hipoblasto forman endodermo."}], "tip": "CID = Converger, Invaginar, Divergir. Es la involución que te pide el doctor.", "sequence": ["Convergencia", "Invaginación", "Divergencia"], "alert": "Los términos endobolia, epibolia e involución se presentan aquí tal como el profesor los utiliza en sus esquemas; algunas nomenclaturas de embriología usan otros términos para describir los movimientos celulares."}, {"id": "gas3", "title": "Divisiones del mesodermo y derivados", "refs": [["gas", 3, 6, 19, 30], ["rep", 3, 3, 9, 13]], "intro": "El mesodermo no es una sola región indiferenciada. Desde la línea media hacia afuera se organiza en axial, paraxial, intermedio y lateral. El origen permite deducir sus derivados.", "points": [{"title": "Axial", "body": "La notocorda ocupa el eje central, organiza el desarrollo y deja como remanente el núcleo pulposo de los discos intervertebrales. El cordoma se relaciona con remanentes notocordales."}, {"title": "Paraxial o somítico", "body": "A ambos lados del eje se organiza en somitas. El esclerotomo se sitúa ventromedialmente; el dermomiotomo da dermatomo (dorsal) y miotomo. Sus derivados incluyen vértebras y costillas, dermis del dorso y músculo esquelético."}, {"title": "Intermedio", "body": "Entre paraxial y lateral. Da estructuras del sistema urogenital, por ejemplo riñones, uréteres y gónadas. El profesor enfatiza la vejiga como excepción."}, {"title": "Lateral", "body": "Se delamina en somático/parietal (adyacente al ectodermo) y esplácnico/visceral (adyacente al endodermo). El espacio entre ambas hojas es el celoma intraembrionario."}, {"title": "Derivados laterales", "body": "El somático contribuye al esqueleto de las extremidades y pared corporal; el esplácnico al corazón, vasos y músculo liso del tubo digestivo, según el repaso."}], "tip": "A-P-I-L: axial, paraxial, intermedio, lateral. Somítico ≠ somático.", "sequence": ["Axial", "Paraxial", "Intermedio", "Lateral"], "alert": "En el repaso del 20 nov. se acota el esqueleto de las extremidades al lateral somático y los músculos al miotomo. No se debe inferir que toda la extremidad tiene un único origen. No se pregunta por la uretra, porque la transcripción la incluye en una generalización urogenital imprecisa."}, {"id": "gas4", "title": "Derivados germinales y plegamiento", "refs": [["gas", 3, 6, 22, 29], ["rep", 2, 3, 10, 16]], "intro": "Para el examen el docente combina el nombre de la capa con sus derivados. Conviene entrenar listas y reconocer la relación entre posición y destino.", "points": [{"title": "Ectodermo", "body": "Epidermis, pelo, uñas, glándulas mamarias y sebáceas, cristalino y oído interno (ectodermo superficial). Neuroectodermo del tubo neural: SNC; cresta neural: múltiples derivados periféricos y craneofaciales."}, {"title": "Mesodermo", "body": "Tejido de sostén, músculos, vasos, corazón y derivados urogenitales; cada región tiene destinos específicos, como se estudió en el bloque anterior."}, {"title": "Endodermo", "body": "Epitelio de los aparatos digestivo y respiratorio y componentes epiteliales de glándulas como hígado, páncreas, tiroides, paratiroides y timo."}, {"title": "Plegamiento", "body": "En la cuarta semana, los movimientos cefalocaudales y laterales transforman el disco plano en un embrión aproximadamente cilíndrico. Mantén el orden de los mesodermos al interpretar un corte."}, {"title": "Saco vitelino", "body": "El profesor enfatiza hematopoyesis temprana y su relación con células germinales primordiales (CGP)."}], "tip": "Para dar cinco derivados del ectodermo: epidermis, pelo, uñas, glándulas mamarias, glándulas sebáceas. Para endodermo: epitelio digestivo, respiratorio, hígado, páncreas, tiroides.", "sequence": null, "alert": null}]}, {"id": "neu", "title": "Neurulación y defectos del tubo neural", "sub": "Inducción, cierre y correlación clínica", "priority": true, "icon": "03", "lessons": [{"id": "neu1", "title": "Inducción neural y fases", "refs": [["neu", 1, 1, 1, 4], ["rep", 3, 4, 13, 14]], "intro": "La notocorda induce cambios del ectodermo suprayacente. El profesor relaciona la expresión diferencial con las fases de placa, surco y tubo.", "points": [{"title": "Inductor", "body": "Notocorda (mesodermo axial). Nogina, cordina y folistatina son los antagonistas de BMP que menciona el docente."}, {"title": "Placa neural", "body": "La reducción de la señal BMP4 en la región inducida favorece engrosamiento del neuroectodermo. En el esquema docente el ectodermo restante expresa BMP y el neuroectodermo se asocia con PAX."}, {"title": "Surco neural", "body": "La placa se invagina y sus bordes se elevan. En la transición de los bordes, el profesor destaca SNAIL y reducción de moléculas de adhesión."}, {"title": "Tubo neural", "body": "Los pliegues se aproximan y fusionan; el tubo se separa del ectodermo superficial. El tubo origina SNC y las células de cresta neural se desprenden y migran."}, {"title": "Cierre", "body": "El inicio se sitúa en el día 21–22 aproximadamente, a nivel cervical en el esquema de clase. El cierre progresa hacia ambos extremos."}], "tip": "N-C-F frenan BMP: Nogina, Cordina, Folistatina. Placa → Surco → Tubo → Crestas migran.", "sequence": ["Inhibición de BMP", "Placa neural", "Surco neural", "Fusión de pliegues", "Tubo neural separado"], "alert": null}, {"id": "neu2", "title": "Neuroporos, cinco puntos y folato", "refs": [["neu", 1, 3, 3, 8], ["rep", 4, 4, 17, 18]], "intro": "El cierre no ocurre simultáneamente en todo el tubo. Las fechas y el modelo de cinco puntos permiten relacionar localización del defecto con presentación clínica.", "points": [{"title": "Cronología del profesor", "body": "Inicio día 21–22; neuroporo anterior día 25; posterior día 27–29. El cierre se completa aproximadamente al final de la cuarta semana."}, {"title": "Modelo de cinco puntos", "body": "1 dorsal, 2 cefálico, 3 facial, 4 occipital, 5 lumbosacro. El profesor lo presenta como teoría antigua útil para recordar patrones de defectos, no como única explicación demostrada."}, {"title": "Asociaciones de clase", "body": "2 → anencefalia; 3 → encefalocele frontal; 4 → encefalocele occipital; 5 → espectro de espina bífida."}, {"title": "Vitamina B9", "body": "El folato participa en la síntesis de nucleótidos, importante durante la replicación en fase S. La suplementación periconcepcional disminuye el riesgo de defectos. El dato habitual de clase es 0.4 mg diarios; se inicia antes de la concepción."}, {"title": "Detección", "body": "La elevación de alfa-fetoproteína puede sugerir defectos abiertos. La ecografía permite estudiar anatomía fetal; un marcador aislado no establece por sí solo el diagnóstico."}], "tip": "21 empieza, 25 delante, 27–29 detrás. Punto 4 = occipital.", "sequence": null, "alert": "En sistema-nervioso-embrio-notes se anotó 27–29 para ambos neuroporos; el repaso y la clase de neurulación distinguen anterior 25 y posterior 27–29. El esquema de dosis altas de folato varía entre clases: no se usa para calificar ni como indicación terapéutica."}, {"id": "neu3", "title": "Anencefalia, encefalocele y espina bífida", "refs": [["neu", 2, 4, 11, 20], ["rep", 6, 7, 18, 20]], "intro": "Relaciona el defecto anatómico con el contenido herniado y el nivel de lesión. No basta con decir «espina bífida»: hay que distinguir las formas y sus complicaciones.", "points": [{"title": "Anencefalia y encefalocele", "body": "La anencefalia implica ausencia de gran parte del encéfalo y bóveda craneal. El encefalocele es protrusión de estructuras intracraneales a través de un defecto craneal; en clase se estudia frontal y occipital."}, {"title": "Espina bífida oculta", "body": "Defecto del arco vertebral sin saco meníngeo visible; un mechón de pelo o nevo piloso puede orientar, pero no está siempre presente."}, {"title": "Meningocele", "body": "Saco de meninges con líquido cefalorraquídeo sin tejido neural en su interior."}, {"title": "Mielomeningocele", "body": "Saco con meninges y tejido neural, asociado a mayor riesgo de déficit motor, sensitivo y autonómico. Puede producir vejiga neurogénica y alteraciones intestinales."}, {"title": "Chiari II e hidrocefalia", "body": "El docente vincula mielomeningocele con descenso de estructuras cerebelosas y alteraciones de circulación de LCR. El aumento del perímetro cefálico puede ser un dato de hidrocefalia. La derivación ventrículo-peritoneal es una opción de manejo cuando está indicada."}], "tip": "Mielo = médula; meningo = meninges; cele = protrusión. Pregúntate qué hay dentro del saco.", "sequence": null, "alert": null}]}, {"id": "snc", "title": "Desarrollo del sistema nervioso", "sub": "Vesículas, histogénesis y LCR", "priority": true, "icon": "04", "lessons": [{"id": "snc1", "title": "Vesículas primarias y secundarias", "refs": [["snc", 1, 1, 3, 6], ["rep", 5, 5, 20, 22]], "intro": "La porción craneal del tubo neural aumenta de tamaño y se diferencia. Distingue vesícula embrionaria, estructura adulta y luz ventricular. El mesencéfalo conserva el mismo nombre al pasar de tres a cinco vesículas.", "points": [{"title": "Cuarta semana", "body": "Tres vesículas primarias: prosencéfalo, mesencéfalo y rombencéfalo. La porción caudal del tubo se relaciona con la futura médula espinal."}, {"title": "Quinta semana", "body": "Prosencéfalo → telencéfalo y diencéfalo. Mesencéfalo → mesencéfalo. Rombencéfalo → metencéfalo y mielencéfalo."}, {"title": "Telencéfalo", "body": "Hemisferios cerebrales, corteza, núcleos basales y bulbo olfatorio. Su luz corresponde a los ventrículos laterales."}, {"title": "Diencéfalo", "body": "Tálamo, hipotálamo, epitálamo y subtálamo; estructuras ópticas e infundíbulo (neurohipófisis). Luz: tercer ventrículo."}, {"title": "Mesencéfalo", "body": "Pedúnculos cerebrales, colículos superior e inferior, sustancia negra y núcleo rojo. Luz: acueducto cerebral."}, {"title": "Metencéfalo y mielencéfalo", "body": "Metencéfalo: puente, cerebelo, núcleos pontinos. Mielencéfalo: bulbo raquídeo y oliva inferior. Comparten regiones del cuarto ventrículo."}], "tip": "TE-DI-ME-META-MIE. Meta = puente + cerebelo; miel = bulbo. El mesencéfalo tiene acueducto, no un ventrículo numerado.", "sequence": ["Prosencéfalo", "Telencéfalo / diencéfalo", "Derivados hemisféricos / talámicos"], "alert": null}, {"id": "snc2", "title": "Sistema ventricular y médula espinal", "refs": [["snc", 1, 1, 1, 2], ["rep", 5, 5, 22, 24], ["otm", 3, 3, 17, 18]], "intro": "Las cavidades del tubo neural persisten como sistema ventricular y conducto central. La circulación del líquido permite razonar la hidrocefalia.", "points": [{"title": "Trayecto", "body": "Ventrículos laterales → forámenes interventriculares de Monro → III ventrículo → acueducto de Silvio → IV ventrículo. Desde el IV pasa al espacio subaracnoideo a través de aperturas laterales de Luschka y mediana de Magendie; una porción continúa al conducto central."}, {"title": "LCR", "body": "Los plexos coroideos producen LCR. Las granulaciones/vellosidades aracnoideas participan en su reabsorción. El acueducto estrecho es un punto importante de obstrucción en clase."}, {"title": "Médula y cono", "body": "La médula espinal no ocupa toda la longitud de la columna. Distal al cono se encuentran raíces de la cauda equina y filum terminale, relacionado con las meninges. El repaso vincula esta anatomía a la punción lumbar."}, {"title": "Arco reflejo", "body": "La aferencia sensitiva llega por dorsal desde el ganglio raquídeo; puede conectar con interneurona y motoneurona ventral. El circuito se integra en la médula, no requiere llegar a la corteza."}], "tip": "Monro une lateral con III; Silvio une III con IV; Luschka laterales, Magendie mediana.", "sequence": ["Ventrículos laterales", "Forámenes de Monro", "III ventrículo", "Acueducto cerebral", "IV ventrículo", "Luschka / Magendie", "Espacio subaracnoideo", "Granulaciones aracnoideas"], "alert": "La transcripción de oído del 18 nov. y sus apuntes invierten/confunden los niveles del cono medular neonatal y adulto. No se califica una cifra exacta hasta revisar la presentación. Tampoco se exige una sola formulación del filum terminale."}, {"id": "snc3", "title": "Neuroepitelio, capas y señalización dorsal–ventral", "refs": [["snc", 2, 3, 3, 6], ["rep", 4, 4, 24, 26], ["otm", 3, 3, 16, 18]], "intro": "La histogénesis explica cómo se distribuyen los cuerpos neuronales y axones. Se estudian tres capas alrededor de la luz, y una diferenciación funcional dorsal y ventral.", "points": [{"title": "Neuroepitelio", "body": "Epitelio seudoestratificado. En la migración nuclear intercinética, la fase S ocurre hacia la región basal/externa de la zona ventricular y la mitosis (M) cerca de la luz."}, {"title": "Zona ventricular o ependimaria", "body": "Es la capa interna de progenitores proliferativos; posteriormente quedan células ependimarias revistiendo cavidades."}, {"title": "Capa del manto", "body": "Neuroblastos posmitóticos y cuerpos neuronales; dará la sustancia gris medular. La capa marginal, más externa, contiene axones y origina la sustancia blanca."}, {"title": "Placas alares", "body": "Dorsales y sensitivas/aferentes; PAX3 y PAX7 en el esquema docente. Placa del techo asociada con BMP4."}, {"title": "Placas basales", "body": "Ventrales, motoras/eferentes; PAX6 en el esquema docente. SHH de notocorda y placa del piso participa en la inducción/patrón ventral. No son respuestas intercambiables si se pregunta por un marcador en particular."}, {"title": "SNA", "body": "El repaso del 18 nov. corrige la región simpática a T1–L2. El parasimpático es craneosacro."}], "tip": "M = mitosis hacia la luz; S = síntesis más externa. A de alar = aferente; B de basal = ventral/motora.", "sequence": null, "alert": "En preguntas sobre inducción ventral, SHH es la señal; si el enunciado pide el PAX de placa basal según el esquema de clase, corresponde PAX6. Evita penalizar respuestas por una redacción ambigua."}, {"id": "snc4", "title": "Organización rostrocaudal, glía e hipófisis", "refs": [["snc", 2, 5, 4, 11], ["rep", 5, 6, 26, 28]], "intro": "El istmo organiza la transición mesencéfalo–rombencéfalo. La glía y las neuronas tienen orígenes diferentes que pueden preguntarse de forma independiente.", "points": [{"title": "Organización axial", "body": "OTX2 identifica regiones anteriores, GBX2 regiones posteriores en el esquema del docente. El istmo se encuentra entre mesencéfalo y rombencéfalo; FGF8 se estudia asociado a la organización de esta región. HOX se relaciona con patrón de rombómeras; el profesor menciona rombómera 1 y labios rómbicos en relación con el cerebelo."}, {"title": "Linaje neuronal", "body": "Progenitor neuroepitelial → neuroblasto → neuronas. En el esquema de clase se menciona la transición bipolar/multipolar."}, {"title": "Linaje glial", "body": "La glía radial guía la migración neuronal y puede dar astrocitos y células ependimarias. En el esquema O2A se asocia con oligodendrocitos y astrocitos tipo II."}, {"title": "Mielinización", "body": "Oligodendrocitos en SNC (tubo neural), Schwann en SNP (cresta neural). La microglía es la excepción mesodérmica entre las células gliales estudiadas."}, {"title": "Hipófisis", "body": "La neurohipófisis se forma por evaginación del piso del diencéfalo (infundíbulo); la adenohipófisis por la bolsa de Rathke del ectodermo oral. La pars tuberalis de la adenohipófisis rodea el infundíbulo; remanentes de Rathke se asocian con craneofaringioma."}, {"title": "Corteza cerebral", "body": "El profesor relaciona circunvoluciones con aumento de superficie y migración neuronal. Los núcleos son grupos de somas en SNC, los ganglios grupos de somas en SNP."}], "tip": "Oligo = central; Schwann = periférico; microglía = mesodermo. Rathke sube desde la boca, infundíbulo baja desde el diencéfalo.", "sequence": null, "alert": "El resumen de SNC menciona FOX para subdivisiones; la transcripción (p. 2) y repaso enfatizan HOX en rombómeras. Se prioriza la formulación explícita del repaso. El linaje O2A se conserva como esquema docente, no como clasificación clínica exhaustiva."}]}, {"id": "cre", "title": "Crestas neurales y neurocristopatías", "sub": "Rutas, dominios y síndromes", "priority": true, "icon": "05", "lessons": [{"id": "cre1", "title": "Origen, transición y matriz extracelular", "refs": [["cre", 1, 4, 1, 2], ["rep", 5, 5, 29, 31]], "intro": "Las células de la cresta neural nacen en el borde del neuroectodermo, durante el plegamiento neural. La clave es que su origen es ectodérmico aunque adquieran una forma mesenquimatosa.", "points": [{"title": "Origen", "body": "Bordes de la placa/surco neural; al cerrarse el tubo se separan y migran. En clase se llama «cuarta hoja blastodérmica» por la diversidad de derivados, no una cuarta capa germinal independiente."}, {"title": "SNAIL y CAMs", "body": "En la transición epitelio-mesénquima se reduce la adhesión celular, cambia el fenotipo y se facilita la migración."}, {"title": "Matriz extracelular", "body": "Fibronectina, laminina y colágeno IV favorecen el desplazamiento en el modelo del docente. El condroitín sulfato inhibe o delimita rutas; inhibición no significa necesariamente patología."}, {"title": "Rutas A, B, C", "body": "A dorsolateral → melanocitos; B ventrolateral → ganglios dorsales y derivados del SNP; C ventromedial/ventral → sistema nervioso entérico y parasimpático. El repaso relaciona también las crestas con médula suprarrenal y Schwann."}], "tip": "A = arriba (pigmento), B = borde ganglionar, C = colon (entérico). Es una ayuda para el esquema de clase.", "sequence": null, "alert": null}, {"id": "cre2", "title": "Dominios y derivados periféricos", "refs": [["cre", 1, 3, 4, 6], ["rep", 5, 6, 31, 34]], "intro": "Las rutas describen la dirección del movimiento en un corte. Los dominios describen regiones extensas del embrión. No son dos listas que deban confundirse entre sí.", "points": [{"title": "Cefálico o craneal", "body": "Aporta estructuras craneofaciales, entre ellas hueso y cartílago facial, tejido conectivo y componentes de ganglios craneales. El docente relaciona dismorfias faciales con este dominio."}, {"title": "Circunfaríngeo y cardíaco", "body": "Se relaciona con región de arcos faríngeos y oído, y con el tracto de salida cardíaco (troncocono). El componente cardíaco contribuye a la separación del tracto de salida."}, {"title": "Dorsal/troncal", "body": "El profesor lo divide en troncal, lumbar y sacro; relaciona ganglios, células de Schwann, melanocitos, médula suprarrenal y el sistema entérico con crestas del tronco y regiones vagal/sacra."}, {"title": "Intestino", "body": "El repaso recuerda la herniación fisiológica desde semana 6 y retorno alrededor de semana 10. Su motilidad depende de la inervación entérica."}, {"title": "Diferenciar", "body": "Tubo neural → SNC; cresta neural → numerosos componentes periféricos. La microglía no es de ninguno de estos linajes ectodérmicos."}], "tip": "Dominio = región; ruta = dirección. Craneal: cara; cardíaco: salida del corazón; entérico: motilidad.", "sequence": null, "alert": "Los nombres de dominios varían por autor en el repaso. La asociación con un órgano no significa que todo ese órgano provenga de la cresta neural. Los músculos de la cara no se evalúan como derivados de cresta, pues el repaso contiene una generalización imprecisa."}, {"id": "cre3", "title": "Síndromes y razonamiento clínico", "refs": [["cre", 2, 4, 6, 9], ["rep", 6, 6, 31, 36], ["oti", 4, 4, 7, 8]], "intro": "El profesor enfatiza partir de una manifestación visible y buscar otras alteraciones relacionadas por el desarrollo. Los siguientes cuadros son claves de sospecha, no criterios diagnósticos completos.", "points": [{"title": "Pigmentación", "body": "En el modelo docente, un mechón blanco localizado puede indicar ausencia de melanocitos por alteración de migración. El albinismo generalizado tiene melanocitos pero producción de melanina alterada; el profesor menciona la tirosinasa como ejemplo."}, {"title": "Waardenburg", "body": "Mechón blanco o cambios pigmentarios, heterocromía y posible sordera neurosensorial. En la clase de oído se menciona tipo IV asociado con aganglionosis intestinal. No confundir con la sola falta de pigmento."}, {"title": "Hirschsprung", "body": "Aganglionosis entérica por desarrollo anómalo de las crestas que colonizan el intestino; alteración de motilidad y dilatación proximal (megacolon). El repaso enfatiza relación ventromedial y dominio vagal/troncal."}, {"title": "CHARGE", "body": "Coloboma, Heart (cardiopatía), Atresia de coanas, Retraso del crecimiento/desarrollo, Genitales y Ear (oído). La combinación exige sospechar un cuadro multiorgánico."}, {"title": "DiGeorge", "body": "Relaciona alteraciones craneofaciales, cardíacas, tímicas y paratiroideas con aparato faríngeo y crestas. Neurofibromatosis tipo 1 y dismorfias faciales también se mencionan; el profesor destaca manchas café con leche en NF1."}, {"title": "Genes y herencia", "body": "La tarea de crestas pide gen, herencia, clínica, diagnóstico y dominio afectado. Los apuntes no documentan una tabla completa de genes por síndrome; queda pendiente integrar las presentaciones del profesor."}], "tip": "CHARGE: C–H–A–R–G–E. Waardenburg: pigmento + audición. Hirschsprung: sin ganglios, no propulsa bien.", "sequence": null, "alert": "No todos los síndromes con pigmentación son neurocristopatías, ni todos los casos con coloboma son CHARGE. No se califican genes o patrones hereditarios no especificados en los materiales disponibles."}]}, {"id": "ojo", "title": "Embriología del ojo", "sub": "Prioridad · examen anunciado 25 nov.", "priority": true, "icon": "06", "lessons": [{"id": "ojo1", "title": "Vesícula óptica, copa y cristalino", "refs": [["ojo", 1, 3, 2, 6]], "intro": "El ojo se organiza mediante inducciones recíprocas. En la clase del 11 de noviembre, el día 22 identifica el comienzo de la evaginación óptica a nivel del futuro diencéfalo. La retina y el cristalino no tienen el mismo origen.", "points": [{"title": "Día 22", "body": "La vesícula óptica aparece como evaginación del prosencéfalo (futuro diencéfalo). PAX6 y RAX son los genes señalados para iniciar el desarrollo ocular."}, {"title": "Inducción del cristalino", "body": "El contacto con el ectodermo superficial induce un engrosamiento (placoda del cristalino). Sigue invaginación, cierre y separación → vesícula del cristalino. La clase compara este patrón con placa, surco y tubo neural."}, {"title": "Copa óptica", "body": "La vesícula óptica se invagina y origina una copa de dos capas. La capa externa se relaciona con MITF y epitelio pigmentario; la interna, con VSX2 y retina neural."}, {"title": "Tallo óptico", "body": "Une la copa al encéfalo. En clase se asocia con PAX2 y origen del nervio óptico. La retina neural aporta las células ganglionares cuyos axones discurren por el tallo."}, {"title": "Relación temporal", "body": "El profesor une ojo (22), cierre neural (21–25), primeros latidos (21–23), oído (23) y riñón en su esquema de relaciones. PAX2 se menciona en ojo, oído y riñón."}], "tip": "Óptica = ojo; ótica = oído. Vesícula óptica sale del encéfalo; vesícula del cristalino entra desde ectodermo superficial.", "sequence": ["Vesícula óptica", "Inducción de placoda del cristalino", "Invaginación", "Copa óptica y vesícula del cristalino"], "alert": null}, {"id": "ojo2", "title": "Retina, arteria hialoidea, iris y cuerpo ciliar", "refs": [["ojo", 1, 3, 6, 16]], "intro": "La copa óptica tiene dos capas que se aproximan durante el desarrollo. La fisura coroidea deja pasar la arteria hialoidea y su cierre constituye un punto clínico esencial.", "points": [{"title": "Retina externa", "body": "Origina el epitelio pigmentario retiniano, una de las diez capas descritas en histología; contiene pigmento y contribuye a absorber luz."}, {"title": "Retina interna", "body": "Origina la retina neural, las otras nueve capas en la clasificación que menciona el profesor. Conos y bastones pertenecen a la retina neural."}, {"title": "Espacio interretiniano", "body": "Es el espacio potencial entre las dos capas. Su separación explica la lógica del desprendimiento de retina."}, {"title": "Fisura coroidea", "body": "Hendidura ventral/inferonasal del tallo y copa ópticos que permite el paso de la arteria hialoidea. El profesor fija su cierre hacia la séptima semana."}, {"title": "Arteria hialoidea", "body": "Nutre las estructuras oculares en desarrollo. La parte distal involuciona y la proximal persiste como arteria central de la retina, según el esquema de clase."}, {"title": "Iris y cuerpo ciliar", "body": "El docente describe el labio iridociliar de la copa óptica. El iris regula la entrada de luz; el cuerpo ciliar participa en la producción de humor acuoso."}], "tip": "Hialoidea: proximal permanece, distal desaparece. Fisura: semana 7. Retina externa pigmenta; interna procesa.", "sequence": null, "alert": null}, {"id": "ojo3", "title": "Córnea, cristalino y cronología palpebral", "refs": [["ojo", 2, 3, 18, 21]], "intro": "La transparencia ocular requiere que distintos tejidos se diferencien adecuadamente. Aprende los orígenes y los cambios descritos por el profesor, separando proteínas cristalinas, capas y fechas.", "points": [{"title": "Córnea: epitelio", "body": "Proviene del ectodermo superficial. El profesor describe un estroma primario inicialmente acelular y rico en ácido hialurónico, que retiene agua."}, {"title": "Migraciones craneales", "body": "La primera migración de cresta neural contribuye al endotelio; una segunda al estroma secundario celular. El docente asocia hialuronidasa, remodelación del estroma y transporte iónico endotelial con transparencia."}, {"title": "Cristalino", "body": "La vesícula del cristalino forma fibras y capas concéntricas, comparadas con una cebolla. Las proteínas cristalinas α, β y γ se asocian con transparencia. Los núcleos se nombran embrionario, fetal, infantil y adulto en clase."}, {"title": "Párpados", "body": "Según la cronología docente: semana 7 aparecen, semana 9 se fusionan y mes 7 prenatal se abren. La maduración lagrimal continúa después del nacimiento; se menciona semana 6 posnatal."}, {"title": "Humores", "body": "El repaso vincula el vítreo con contribuciones de células de cresta neural cefálica y con forma del globo, y el acuoso con cuerpo ciliar. No son el mismo fluido."}], "tip": "7–9–7: semana 7 aparecen, semana 9 fusionan, mes 7 abren. Córnea: epitelio superficial; endotelio y estroma, cresta neural.", "sequence": null, "alert": "Los apuntes simplifican el origen del vítreo y la regulación de la transparencia corneal; no se trata como origen exclusivo ni se pregunta por la afirmación de que una hormona por sí sola determina toda la transparencia."}, {"id": "ojo4", "title": "Malformaciones oculares y síndromes", "refs": [["ojo", 2, 4, 13, 18], ["ojo", 2, 3, 20, 21], ["rep", 6, 6, 34, 36]], "intro": "Para el examen, conecta el hallazgo clínico con la etapa que falló. La transcripción del profesor pide relacionar coloboma con riñón, oído y corazón; las asociaciones orientan a estudiar otros órganos, no confirman solas un síndrome.", "points": [{"title": "Anoftalmia y línea media", "body": "La anoftalmia es ausencia del globo ocular por alteración temprana. El docente relaciona SHH con separación de campos oculares y prosencéfalo; su alteración puede asociarse a holoprosencefalia y ciclopía/sinoftalmia."}, {"title": "Aniridia", "body": "Ausencia o hipoplasia marcada del iris. No equivale a un coloboma, que es un defecto focal de cierre de la fisura."}, {"title": "Coloboma", "body": "Cierre incompleto de fisura coroidea; puede afectar iris, retina o nervio óptico. La fotofobia puede resultar de alteración en el control de luz por el iris. En clase se enfatiza el coloboma iridiano y asociación ocular-renal con PAX2."}, {"title": "Catarata congénita", "body": "Opacidad del cristalino. La clase menciona rubéola materna como causa de catarata congénita y alteración de transparencia de cristalinas."}, {"title": "Glaucoma congénito", "body": "Alteración del drenaje de humor acuoso y aumento de presión intraocular; no es una opacidad primaria del cristalino."}, {"title": "Integración", "body": "Coloboma con cardiopatía y alteraciones del oído hace sospechar CHARGE. Coloboma del nervio óptico con alteraciones renales orienta a la asociación óculo-renal."}], "tip": "Coloboma = cierre; catarata = transparencia; glaucoma = presión; aniridia = iris ausente. SHH = línea media.", "sequence": null, "alert": null}]}, {"id": "oti", "title": "Oído interno", "sub": "Prioridad · origen, otocisto y audición", "priority": true, "icon": "07", "lessons": [{"id": "oti1", "title": "Placoda ótica y división del otocisto", "refs": [["oti", 1, 2, 2, 8], ["oti", 1, 2, 8, 10]], "intro": "El oído interno aparece cerca del rombencéfalo, pero no deriva de él. Este contraste es una pregunta explícita de clase. La inducción de ectodermo superficial forma una vesícula que dará el laberinto membranoso.", "points": [{"title": "Origen y día", "body": "La placoda ótica procede del ectodermo superficial a nivel del rombencéfalo, alrededor del día 23 en el esquema del profesor. Los tres estímulos mencionados son notocorda, mesodermo paraxial y rombencéfalo."}, {"title": "Inducción", "body": "La clase usa inhibición de BMP4 y expresión de PAX2 como esquema de diferenciación ótica. Relaciona PAX2 con desarrollo de ojo, oído y riñón."}, {"title": "Secuencia", "body": "Placoda (engrosamiento) → fosita ótica (invaginación) → otocisto o vesícula ótica (separación del ectodermo). El tallo ectodérmico transitorio desaparece."}, {"title": "Porción dorsal/vestibular", "body": "Origina utrículo y conductos semicirculares; se relaciona con equilibrio. El repaso oral distingue la región vestibular de la coclear."}, {"title": "Porción ventral/coclear", "body": "Origina sáculo y conducto coclear; la cóclea se relaciona con audición. El conducto utriculosacular comunica ambas regiones."}, {"title": "Ganglios", "body": "Ganglio vestibular y ganglio coclear se relacionan con el VIII par craneal o nervio vestibulococlear."}], "tip": "Ótica = oído. Está A LA ALTURA del rombencéfalo, pero viene de ectodermo. Dorsal: utrículo + conductos; ventral: sáculo + cóclea.", "sequence": ["Placoda ótica", "Fosita ótica", "Otocisto", "Porciones vestibular y coclear"], "alert": "El resumen del 17 nov. p. 2 coloca el sáculo en la porción dorsal; el profesor aclara en la transcripción p. 10 (29:50–30:19) que sáculo y cóclea provienen de la porción coclear ventral. Se prioriza esa explicación; no se preguntan marcadores vestibulares transcritos de forma dudosa."}, {"id": "oti2", "title": "Morfogénesis vestibular y coclear", "refs": [["oti", 2, 3, 8, 10]], "intro": "Las porciones del otocisto cambian de forma de manera distinta. Los canales semicirculares necesitan remodelación de sus paredes; el conducto coclear crece y se enrolla.", "points": [{"title": "Diferenciación inicial", "body": "Alrededor de semana 5 se distinguen las porciones dorsal y ventral. La dorsal es más voluminosa en el dibujo, y la ventral se alarga."}, {"title": "Canales semicirculares", "body": "Las evaginaciones vestibulares se remodelan mediante fusión de paredes y apoptosis localizada, según la explicación de clase. Esto permite la configuración de los tres conductos."}, {"title": "Cóclea", "body": "Alargamiento y enrollamiento hasta aproximadamente dos vueltas y media. El docente señala diferencias entre libros acerca del momento exacto en que termina el enrollamiento."}, {"title": "Cronología", "body": "Semanas 6–7: canales y vueltas cocleares en formación; semana 9: configuración general avanzada del oído interno. Se menciona maduración y osificación posterior hacia semanas 23–25, sin fijar una sola fecha para la última media vuelta."}, {"title": "Función", "body": "Vestíbulo y conductos semicirculares se relacionan con equilibrio y posición/movimiento; cóclea, con audición."}], "tip": "Semicirculares: remodelar/apoptosis; cóclea: alargar/enrollar. 2.5 vueltas; no inventes una semana exacta que el profesor no fijó.", "sequence": null, "alert": null}, {"id": "oti3", "title": "Líquidos, rampas y órgano de Corti", "refs": [["oti", 2, 4, 10, 12]], "intro": "Para convertir vibración en señal nerviosa hay que distinguir los espacios del laberinto y las células sensoriales. La pregunta clásica es dónde está cada líquido y dónde se realiza la transducción.", "points": [{"title": "Laberintos", "body": "El laberinto membranoso contiene endolinfa. El espacio entre él y el laberinto óseo contiene perilinfa."}, {"title": "Rampa vestibular", "body": "Espacio superior de la cóclea con perilinfa. La rampa timpánica, inferior, también contiene perilinfa. La rampa media o conducto coclear contiene endolinfa."}, {"title": "Órgano de Corti", "body": "Se ubica en la rampa media sobre la membrana basilar. Contiene células ciliadas internas y externas; el túnel de Corti y la membrana tectorial son referencias de la clase."}, {"title": "Trayecto del sonido", "body": "Pabellón → conducto auditivo externo → membrana timpánica → martillo/yunque/estribo → ventana oval → ondas de presión en líquidos cocleares → movimiento de membranas y estereocilios → señal nerviosa por VIII."}, {"title": "Transducción", "body": "El desplazamiento relativo de membrana basilar y estructuras del órgano de Corti deflecta los estereocilios, convirtiendo movimiento en señal eléctrica. En clase se resalta la membrana tectorial."}], "tip": "ENDO = dentro del laberinto membranoso y rampa media. PERI = alrededor y rampas vestibular/timpánica.", "sequence": ["Pabellón auricular", "Conducto auditivo externo", "Membrana timpánica", "Cadena de huesecillos", "Ventana oval", "Órgano de Corti", "Nervio vestibulococlear"], "alert": "El resumen de oído (pp. 2–3) ubica endolinfa dentro y perilinfa fuera del laberinto membranoso. En la transcripción p. 12 las palabras se intercambian. Se usa la distinción coherente de los apuntes."}]}, {"id": "otm", "title": "Oído externo, medio y aparato faríngeo", "sub": "Prioridad · arcos, bolsas y hendiduras", "priority": true, "icon": "08", "lessons": [{"id": "otm1", "title": "Arcos, bolsas y hendiduras", "refs": [["otm", 1, 2, 1, 5], ["car", 3, 3, 14, 15], ["rep", 2, 3, 12, 12]], "intro": "Los arcos faríngeos organizan el desarrollo de múltiples estructuras de cabeza y cuello. Para razonar los derivados del oído es imprescindible distinguir las superficies externas de las internas.", "points": [{"title": "Arcos", "body": "El profesor enumera 1, 2, 3, 4 y 6; el quinto es vestigial. Aparecen alrededor de la cuarta semana. El mesénquima de cada arco está cubierto por ectodermo externamente y endodermo internamente."}, {"title": "Hendiduras", "body": "Son surcos externos revestidos de ectodermo. Se describen cuatro hendiduras. La primera origina el conducto auditivo externo."}, {"title": "Bolsas", "body": "Son expansiones internas revestidas de endodermo. Se describen cuatro bolsas. La primera forma la cavidad timpánica y tuba auditiva."}, {"title": "Derivados óseos en clase", "body": "Primer arco: martillo, yunque y componentes maxilomandibulares; segundo: estribo y parte superior del hioides; tercero: parte inferior y asta mayor del hioides; cuarto y sexto: componentes laríngeos."}, {"title": "Membranas", "body": "La membrana timpánica se relaciona con primera hendidura y primera bolsa; posee ectodermo, mesénquima y endodermo. En el repaso se menciona tercera bolsa para timo y paratiroides inferiores."}], "tip": "Arco = sostén mesenquimatoso; bolsa = por dentro; hendidura = por fuera. 1: martillo + yunque; 2: estribo.", "sequence": null, "alert": "La transcripción en inglés del 20 nov. menciona por error segunda bolsa para oído medio; la clase específica del 18 nov. confirma primera bolsa. No se evalúa la tabla completa de músculos, nervios y arterias de arcos porque las presentaciones faltan."}, {"id": "otm2", "title": "Oído medio y externo: derivados y fechas", "refs": [["otm", 1, 3, 2, 6]], "intro": "Cada componente tiene una procedencia distinta. En el oído medio, no basta con que se formen los huesecillos: deben quedar libres para transmitir vibraciones.", "points": [{"title": "Oído medio", "body": "La primera bolsa se expande y forma el receso tubotimpánico. Su parte distal da cavidad timpánica; su parte proximal, tuba auditiva."}, {"title": "Huesecillos", "body": "Martillo y yunque del primer arco, estribo del segundo en la enseñanza de clase. Inicialmente están rodeados por mesénquima; su desaparición/remodelación permite que se muevan."}, {"title": "Oído externo", "body": "Primera hendidura → conducto auditivo externo. Al principio está ocluido por un tapón meatal que se recanaliza posteriormente."}, {"title": "Membrana timpánica", "body": "Límite entre oído externo y medio; capa externa ectodérmica, media mesenquimatosa e interna endodérmica."}, {"title": "Pabellón", "body": "Seis protuberancias auriculares, tres del primer arco y tres del segundo. La forma y posición cambian a medida que crece la mandíbula y la cara."}, {"title": "Cronología docente", "body": "Alrededor del séptimo mes se menciona desaparición del mesénquima periosicular y del tapón meatal. El profesor usa este momento para explicar que la conducción madura progresivamente."}], "tip": "Primera bolsa = caja y tuba. Primera hendidura = conducto. Seis montículos = 3 + 3. Séptimo mes: libera el paso y los huesecillos.", "sequence": null, "alert": null}, {"id": "otm3", "title": "Hipoacusia y malformaciones del oído", "refs": [["otm", 2, 4, 8, 15], ["oti", 4, 4, 7, 8]], "intro": "La clasificación anatómica de la pérdida auditiva permite razonar a partir de una estructura afectada. El profesor pregunta especialmente microtia-atresia y la relación con Waardenburg.", "points": [{"title": "Oído externo", "body": "Capta y conduce ondas. Alteración del conducto, por ejemplo atresia, produce una barrera para la conducción."}, {"title": "Oído medio", "body": "Transmite/amplifica vibración mediante membrana timpánica y huesecillos. Malformación, fijación o discontinuidad de la cadena altera la transmisión."}, {"title": "Oído interno", "body": "La cóclea y el órgano de Corti realizan transducción; el nervio VIII lleva la señal. Su afectación se relaciona con hipoacusia neurosensorial."}, {"title": "Microtia y atresia", "body": "Microtia es malformación del pabellón; atresia es ausencia u obstrucción congénita del conducto. Pueden coexistir. La clase menciona reconstrucción auricular con cartílago costal y rehabilitación auditiva según anatomía y función."}, {"title": "Síndromes", "body": "Waardenburg asocia alteraciones pigmentarias y posible sordera neurosensorial. CHARGE combina defectos de oído con otras malformaciones. No basta el aspecto del pabellón para deducir el estado de la cóclea."}], "tip": "Externo/medio = conducir; interno = convertir. Microtia describe oreja, atresia describe conducto.", "sequence": null, "alert": "Las opciones quirúrgicas se mencionan como ejemplos del profesor, no como algoritmo terapéutico; la evaluación individual auditiva es necesaria."}]}, {"id": "car", "title": "Cara y cráneo", "sub": "Procesos faciales, osificación y fisuras", "priority": true, "icon": "09", "lessons": [{"id": "car1", "title": "Neurocráneo, viscerocráneo y osificación", "refs": [["car", 1, 2, 1, 5]], "intro": "El neurocráneo protege al SNC y el viscerocráneo constituye el esqueleto facial. Los dos incluyen componentes que se osifican por mecanismos distintos.", "points": [{"title": "Orígenes", "body": "En la simplificación docente, neurocráneo se asocia a somitas/mesodermo paraxial y viscerocráneo a cresta neural craneal. Existen contribuciones mixtas; no son orígenes exclusivos para todos los huesos."}, {"title": "Intramembranosa", "body": "Formación directa de hueso a partir de mesénquima sin molde cartilaginoso previo. Ejemplo del profesor: parietal."}, {"title": "Endocondral", "body": "Un molde de cartílago es reemplazado progresivamente por hueso; se estudia en huesos largos y gran parte de la base craneal."}, {"title": "Genes", "body": "SOX9 favorece diferenciación cartilaginosa; RUNX2 se asocia con diferenciación osteoblástica. El profesor usa SOX9 → RUNX2 como esquema para cartílago seguido de hueso."}, {"title": "Huesos mixtos", "body": "Temporal y occipital presentan porciones con ambos mecanismos. Acondroplasia altera crecimiento endocondral, con relevancia clínica del foramen magno y posible compresión de estructuras neurales."}], "tip": "SOX9 → cartílago; RUNX2 → hueso. Bóveda plana vs base cartilaginosa.", "sequence": null, "alert": null}, {"id": "car2", "title": "Fontanelas y suturas: craneosinostosis", "refs": [["car", 2, 2, 4, 7]], "intro": "El cráneo neonatal mantiene zonas fibrosas que facilitan el crecimiento. Una sutura que cierra antes de tiempo restringe crecimiento perpendicular y modifica la forma craneal.", "points": [{"title": "Fontanela anterior", "body": "Entre frontal y parietales; es la mayor. Cierre aproximado en clase: 12–18 meses posnatales."}, {"title": "Fontanela posterior", "body": "Entre parietales y occipital; el profesor menciona 2–3 meses."}, {"title": "Suturas", "body": "Coronal une frontal con parietales; sagital une ambos parietales; lambdoidea se relaciona con el occipital."}, {"title": "Craneosinostosis", "body": "Fusión prematura de una o más suturas. El cierre sagital se asocia con escafocefalia/dolicocefalia (cráneo largo en sentido anteroposterior); cierre unilateral coronal puede causar plagiocefalia."}, {"title": "Otras formas", "body": "El profesor asocia cierre coronal prematuro a turicefalia/oxicefalia en su esquema y fusión múltiple a restricción del crecimiento craneal. La forma exacta depende de suturas y gravedad."}], "tip": "Anterior: 12–18 meses; posterior: 2–3 meses. Sagital → largo; coronal unilateral → asimetría.", "sequence": null, "alert": "No se toma la asociación simplificada entre una única sutura coronal y oxicefalia como respuesta universal; las formas varían. La microcefalia no implica obligatoriamente craneosinostosis."}, {"id": "car3", "title": "Procesos faciales y sus derivados", "refs": [["car", 3, 5, 7, 10], ["car", 3, 5, 14, 15]], "intro": "Entre las semanas 4 y 8, las prominencias faciales crecen y se aproximan. El estomodeo es la boca primitiva; a su alrededor se organizan las prominencias frontonasal, maxilares y mandibulares.", "points": [{"title": "Frontonasal", "body": "La prominencia superior contribuye a frente y nariz; el profesor relaciona la región frontal con parte superior de órbita y párpado superior. Las placodas nasales se invaginan para formar fositas nasales, delimitadas por procesos nasales mediales y laterales."}, {"title": "Nasomediales", "body": "Se fusionan en línea media y forman el segmento intermaxilar (premaxila). En clase se relacionan con filtrum, columela y porción media nasal; la premaxila alberga los cuatro incisivos superiores y contribuye al paladar primario."}, {"title": "Nasolaterales", "body": "Contribuyen a alas nasales y región lateral de la nariz. La presencia del ala ayuda al profesor a diferenciar patrones de fisuras."}, {"title": "Maxilares", "body": "Derivan del primer arco; se relacionan con mejillas, parte inferior de órbita, párpado inferior, lateral del labio superior, maxilar y paladar secundario. En el esquema docente, dientes superiores salvo los cuatro incisivos premaxilares."}, {"title": "Mandibulares", "body": "Del primer arco; mandíbula, labio inferior, mentón y dentición inferior. Las prominencias derecha e izquierda deben unirse en la línea media."}, {"title": "Estadios Carnegie", "body": "El docente usa secuencias morfológicas de semanas 4–8 para seguir el desplazamiento de prominencias; no son solo fechas cronológicas."}], "tip": "Medial = filtrum y premaxila; lateral = alas nasales. Maxilar = lado del labio superior; mandibular = labio inferior.", "sequence": null, "alert": null}, {"id": "car4", "title": "Fisuras faciales y anomalías mandibulares", "refs": [["car", 3, 5, 11, 15]], "intro": "La clave de las fisuras es saber qué prominencias debían unirse. El profesor pide deducir el fallo a partir de la forma del defecto, no memorizar únicamente nombres.", "points": [{"title": "Labio hendido", "body": "Se relaciona con falta de unión entre prominencia maxilar y nasal medial del lado afectado. Puede ser unilateral o bilateral, con o sin paladar hendido."}, {"title": "Paladar hendido", "body": "Fallo de desarrollo o fusión de los procesos palatinos entre sí o con paladar primario, según la región. No es exactamente el mismo defecto que el labio hendido."}, {"title": "Fisura facial oblicua", "body": "Falta de unión entre prominencia maxilar y nasal lateral; puede extenderse hacia el ojo en la región del surco nasolagrimal."}, {"title": "Macrostomía", "body": "Boca anormalmente ancha, asociada a unión insuficiente entre procesos maxilar y mandibular. Microstomía describe boca pequeña."}, {"title": "Micrognatia y retrognatia", "body": "Micrognatia es mandíbula de tamaño reducido; retrognatia describe posición posterior respecto al maxilar. No son sinónimos."}, {"title": "Línea media", "body": "Hipotelorismo implica distancia interorbitaria reducida; las alteraciones del patrón de línea media pueden afectar varias estructuras faciales."}], "tip": "Hendidura labial = maxilar + medial. Fisura oblicua = maxilar + lateral. Macrostomía = maxilar + mandibular.", "sequence": null, "alert": null}]}], "questions": [{"id": "seg1-1", "module": "seg", "lesson": "seg1", "stem": "¿Qué significa que la segmentación sea holoblástica?", "correct": "División completa de la célula", "options": ["División completa de la célula", "Todas las células se dividen a la vez", "Aumenta el volumen embrionario", "Se forma el blastocele"], "why": "La división completa origina blastómeras individualizadas.", "case": false}, {"id": "seg1-2", "module": "seg", "lesson": "seg1", "stem": "Si las divisiones tienen intervalos distintos, ¿qué característica se observa?", "correct": "Asincrónica", "options": ["Asincrónica", "Asimétrica", "Holoblástica", "Rotacional"], "why": "La asincronía se refiere al tiempo, no al tamaño.", "case": false}, {"id": "seg1-3", "module": "seg", "lesson": "seg1", "stem": "¿Cuándo sitúa la clase el inicio de la compactación?", "correct": "Alrededor de 8 células", "options": ["Alrededor de 8 células", "En el cigoto", "A las 16 semanas", "En el blastocisto implantado"], "why": "El esquema del profesor señala compactación en ocho blastómeras.", "case": false}, {"id": "seg1-4", "module": "seg", "lesson": "seg1", "stem": "¿Qué estadio se denomina mórula en los apuntes?", "correct": "16 células compactadas", "options": ["16 células compactadas", "Dos pronúcleos", "Disco trilaminar", "Cavidad amniótica"], "why": "La mórula es el conjunto compacto previo al blastocisto.", "case": false}, {"id": "seg2-1", "module": "seg", "lesson": "seg2", "stem": "¿Cómo se llama la cavidad del blastocisto?", "correct": "Blastocele", "options": ["Blastocele", "Celoma intraembrionario", "Conducto neural", "Saco coriónico"], "why": "La cavitación de la mórula genera el blastocele.", "case": false}, {"id": "seg2-2", "module": "seg", "lesson": "seg2", "stem": "¿Qué población da origen al embrión propiamente dicho?", "correct": "Embrioblasto", "options": ["Embrioblasto", "Trofoblasto", "Zona pelúcida", "Hipoblasto únicamente"], "why": "La masa celular interna es el embrioblasto.", "case": false}, {"id": "seg2-3", "module": "seg", "lesson": "seg2", "stem": "¿Qué evento permite que el blastocisto contacte directamente el endometrio?", "correct": "Eclosión de la zona pelúcida", "options": ["Eclosión de la zona pelúcida", "Delaminación lateral", "Cierre del neuroporo", "Formación del miotomo"], "why": "La pérdida de la cubierta permite la implantación.", "case": false}, {"id": "seg2-4", "module": "seg", "lesson": "seg2", "stem": "Caso: Implantación en la tuba uterina. ¿Cómo se clasifica?", "correct": "Embarazo ectópico tubárico", "options": ["Embarazo ectópico tubárico", "Placenta previa", "Gemelismo dicigótico", "Implantación fúndica normal"], "why": "La tuba no es el sitio normal de implantación.", "case": true}, {"id": "seg3-1", "module": "seg", "lesson": "seg3", "stem": "¿Qué define a los gemelos dicigóticos?", "correct": "Dos cigotos independientes", "options": ["Dos cigotos independientes", "Separación de un embrioblasto", "Un blastocisto con dos amnios", "Fusión de dos neuroporos"], "why": "El número de fecundaciones distingue los dos tipos.", "case": false}, {"id": "seg3-2", "module": "seg", "lesson": "seg3", "stem": "¿Qué determina el patrón de membranas en gemelos monocigóticos en el modelo de clase?", "correct": "Momento de separación", "options": ["Momento de separación", "Sexo fetal exclusivamente", "Número de somitas", "Cierre de la fisura coroidea"], "why": "El estadio en que se separa influye en la corionicidad y amnionicidad.", "case": false}, {"id": "seg3-3", "module": "seg", "lesson": "seg3", "stem": "¿Qué eje ayuda a establecer la línea primitiva?", "correct": "Craneocaudal", "options": ["Craneocaudal", "Solo lateral izquierdo", "Radial de la retina", "Vestibulococlear"], "why": "La estría se forma desde caudal hacia craneal.", "case": false}, {"id": "seg3-4", "module": "seg", "lesson": "seg3", "stem": "¿Con qué patrón se relaciona la expresión LEFTY/PITX2 en el repaso?", "correct": "Lateralidad izquierda", "options": ["Lateralidad izquierda", "Mielinización", "Formación del cristalino", "Resorción del cartílago"], "why": "La cascada se vincula al establecimiento del lado izquierdo.", "case": false}, {"id": "gas1-1", "module": "gas", "lesson": "gas1", "stem": "¿Qué estructura marca el inicio de gastrulación?", "correct": "Línea primitiva", "options": ["Línea primitiva", "Vesícula ótica", "Neuroporo anterior", "Copa óptica"], "why": "Las migraciones que forman las capas dependen de la aparición de la línea.", "case": false}, {"id": "gas1-2", "module": "gas", "lesson": "gas1", "stem": "¿Qué capa se encuentra dorsalmente en el disco bilaminar?", "correct": "Epiblasto", "options": ["Epiblasto", "Hipoblasto", "Mesodermo lateral", "Endodermo definitivo"], "why": "El epiblasto está junto a la cavidad amniótica.", "case": false}, {"id": "gas1-3", "module": "gas", "lesson": "gas1", "stem": "¿Qué relación existe entre el nódulo de Hensen y la notocorda?", "correct": "Células migran por el nodo y forman el mesodermo axial", "options": ["Células migran por el nodo y forman el mesodermo axial", "El nodo es el núcleo pulposo adulto", "La notocorda forma el hipoblasto", "Son términos anatómicos idénticos"], "why": "El nodo es una región de ingreso, la notocorda una estructura axial.", "case": false}, {"id": "gas1-4", "module": "gas", "lesson": "gas1", "stem": "¿Qué debe cambiar para que las células ingresen por la línea?", "correct": "Disminuir adhesión celular", "options": ["Disminuir adhesión celular", "Aumentar compactación de la mórula", "Formar mielina", "Secretar cristalinas"], "why": "La reducción de CAMs facilita la migración.", "case": false}, {"id": "gas1-5", "module": "gas", "lesson": "gas1", "stem": "¿Qué capas se encuentran directamente unidas en las membranas bucofaríngea y cloacal?", "correct": "Ectodermo y endodermo", "options": ["Ectodermo y endodermo", "Dos láminas mesodérmicas", "Mesodermo y trofoblasto", "Ectodermo y mesodermo"], "why": "Son zonas sin mesodermo interpuesto en el esquema de clase.", "case": false}, {"id": "gas2-1", "module": "gas", "lesson": "gas2", "stem": "¿Qué movimiento crea una cavidad?", "correct": "Cavitación", "options": ["Cavitación", "Endobolia", "Epibolia", "Divergencia"], "why": "Primero se forma el espacio, después se reviste.", "case": false}, {"id": "gas2-2", "module": "gas", "lesson": "gas2", "stem": "¿Qué movimiento va desde la periferia hacia un punto común?", "correct": "Convergencia", "options": ["Convergencia", "Divergencia", "Delaminación", "Evaginación"], "why": "Convergencia significa acercarse a un centro común.", "case": false}, {"id": "gas2-3", "module": "gas", "lesson": "gas2", "stem": "¿Cuál es el orden de la involución según el profesor?", "correct": "Convergencia, invaginación, divergencia", "options": ["Convergencia, invaginación, divergencia", "Divergencia, cavitación, epibolia", "Invaginación, delaminación, convergencia", "Epibolia, divergencia, invaginación"], "why": "CID resume el movimiento del mesodermo.", "case": false}, {"id": "gas2-4", "module": "gas", "lesson": "gas2", "stem": "¿Qué movimiento asocia la clase con la formación del endodermo embrionario?", "correct": "Poliinvaginación", "options": ["Poliinvaginación", "Epibolia", "Cavitación", "Delaminación"], "why": "Las células migran y sustituyen al hipoblasto.", "case": false}, {"id": "gas2-5", "module": "gas", "lesson": "gas2", "stem": "¿De dónde derivan las tres capas germinales definitivas?", "correct": "Epiblasto", "options": ["Epiblasto", "Hipoblasto", "Trofoblasto", "Mesodermo extraembrionario"], "why": "Las tres se establecen a partir de la población epiblástica.", "case": false}, {"id": "gas2-6", "module": "gas", "lesson": "gas2", "stem": "Según la nomenclatura de clase, ¿qué movimiento recubre una cavidad previamente formada?", "correct": "Endobolia", "options": ["Endobolia", "Cavitación", "Convergencia", "Rotación"], "why": "El docente diferencia formación de revestimiento.", "case": false}, {"id": "gas3-1", "module": "gas", "lesson": "gas3", "stem": "¿Qué orden sigue el mesodermo de medial a lateral?", "correct": "Axial, paraxial, intermedio, lateral", "options": ["Axial, paraxial, intermedio, lateral", "Paraxial, axial, lateral, intermedio", "Lateral, axial, intermedio, paraxial", "Intermedio, lateral, paraxial, axial"], "why": "El orden espacial permite reconocer cada región.", "case": false}, {"id": "gas3-2", "module": "gas", "lesson": "gas3", "stem": "¿Qué estructura adulta deriva de la notocorda?", "correct": "Núcleo pulposo", "options": ["Núcleo pulposo", "Anillo fibroso completo", "Médula espinal", "Ganglio dorsal"], "why": "El núcleo pulposo es el remanente axial.", "case": false}, {"id": "gas3-3", "module": "gas", "lesson": "gas3", "stem": "¿Qué componente del somita da origen a vértebras y costillas?", "correct": "Esclerotomo", "options": ["Esclerotomo", "Dermatomo", "Miotomo", "Mesodermo intermedio"], "why": "El esclerotomo origina el esqueleto axial segmentario.", "case": false}, {"id": "gas3-4", "module": "gas", "lesson": "gas3", "stem": "¿Qué componente origina músculo esquelético?", "correct": "Miotomo", "options": ["Miotomo", "Dermatomo", "Esclerotomo", "Notocorda"], "why": "Mio significa músculo.", "case": false}, {"id": "gas3-5", "module": "gas", "lesson": "gas3", "stem": "¿Qué estructura forma el espacio entre hojas del mesodermo lateral?", "correct": "Celoma intraembrionario", "options": ["Celoma intraembrionario", "Blastocele", "Copa óptica", "Surco neural"], "why": "La delaminación separa las hojas somática y esplácnica.", "case": false}, {"id": "gas3-6", "module": "gas", "lesson": "gas3", "stem": "¿De qué mesodermo derivan el corazón y grandes vasos según el esquema?", "correct": "Lateral esplácnico", "options": ["Lateral esplácnico", "Lateral somático", "Axial", "Intermedio"], "why": "La hoja visceral se relaciona con las vísceras y sistema cardiovascular.", "case": false}, {"id": "gas3-7", "module": "gas", "lesson": "gas3", "stem": "¿De qué mesodermo derivan los riñones?", "correct": "Intermedio", "options": ["Intermedio", "Paraxial", "Axial", "Lateral somático"], "why": "El intermedio se relaciona con el aparato urogenital.", "case": false}, {"id": "gas3-8", "module": "gas", "lesson": "gas3", "stem": "¿Qué hoja lateral está adyacente al ectodermo?", "correct": "Somática", "options": ["Somática", "Esplácnica", "Ependimaria", "Hipoblástica"], "why": "La hoja parietal/somática es la más dorsal en el corte de clase.", "case": false}, {"id": "gas4-1", "module": "gas", "lesson": "gas4", "stem": "¿Qué origen tiene la epidermis?", "correct": "Ectodermo superficial", "options": ["Ectodermo superficial", "Mesodermo paraxial", "Endodermo", "Mesodermo esplácnico"], "why": "No confundir epidermis con dermis.", "case": false}, {"id": "gas4-2", "module": "gas", "lesson": "gas4", "stem": "¿Qué conjunto pertenece al endodermo según los apuntes?", "correct": "Epitelio digestivo, hígado y páncreas", "options": ["Epitelio digestivo, hígado y páncreas", "Uñas, cabello y cristalino", "Vértebras, costillas y músculo", "Melanocitos, Schwann y ganglios"], "why": "El endodermo contribuye a revestimientos internos y glándulas asociadas.", "case": false}, {"id": "gas4-3", "module": "gas", "lesson": "gas4", "stem": "¿Qué sucede morfológicamente en la cuarta semana según el repaso?", "correct": "Plegamiento del disco hacia forma cilíndrica", "options": ["Plegamiento del disco hacia forma cilíndrica", "Formación del cigoto", "Fusión de párpados", "Cierre de fontanela anterior"], "why": "El plegamiento transforma la forma del disco.", "case": false}, {"id": "gas4-4", "module": "gas", "lesson": "gas4", "stem": "¿Qué capa es la fuente del sistema nervioso central?", "correct": "Neuroectodermo del tubo neural", "options": ["Neuroectodermo del tubo neural", "Hipoblasto", "Mesodermo lateral", "Endodermo"], "why": "La neurulación transforma una región del ectodermo en tubo neural.", "case": false}, {"id": "neu1-1", "module": "neu", "lesson": "neu1", "stem": "¿Cuál es el inductor primario de la placa neural?", "correct": "Notocorda", "options": ["Notocorda", "Trofoblasto", "Saco vitelino", "Placoda ótica"], "why": "El mesodermo axial emite señales inductoras.", "case": false}, {"id": "neu1-2", "module": "neu", "lesson": "neu1", "stem": "¿Qué moléculas inhiben BMP según el docente?", "correct": "Nogina, cordina y folistatina", "options": ["Nogina, cordina y folistatina", "NODAL, LEFTY y PITX2", "MITF, VSX2 y PAX2", "RUNX2, SOX9 y OCT4"], "why": "Son antagonistas asociados a la inducción neural.", "case": false}, {"id": "neu1-3", "module": "neu", "lesson": "neu1", "stem": "¿Cómo se llama el engrosamiento inicial del neuroectodermo?", "correct": "Placa neural", "options": ["Placa neural", "Surco neural", "Otocisto", "Cresta ilíaca"], "why": "El engrosamiento precede a la invaginación.", "case": false}, {"id": "neu1-4", "module": "neu", "lesson": "neu1", "stem": "¿Qué factor destaca el profesor en las células de transición de los pliegues?", "correct": "SNAIL", "options": ["SNAIL", "OCT4", "RUNX2", "MITF"], "why": "SNAIL se vincula al cambio de adhesión y fenotipo migratorio.", "case": false}, {"id": "neu1-5", "module": "neu", "lesson": "neu1", "stem": "¿Qué estructura deriva del tubo neural?", "correct": "Sistema nervioso central", "options": ["Sistema nervioso central", "Ganglio raquídeo completo", "Epitelio corneal", "Martillo"], "why": "El tubo neural da lugar al encéfalo y médula espinal.", "case": false}, {"id": "neu2-1", "module": "neu", "lesson": "neu2", "stem": "¿En qué día sitúa el repaso el cierre anterior?", "correct": "25", "options": ["25", "21", "29 exclusivamente", "35"], "why": "El anterior cierra antes que el posterior.", "case": false}, {"id": "neu2-2", "module": "neu", "lesson": "neu2", "stem": "¿Cuándo cierra el neuroporo posterior según el repaso?", "correct": "Días 27–29", "options": ["Días 27–29", "Día 14", "Día 22", "Semana 9"], "why": "El docente acepta el intervalo según libros.", "case": false}, {"id": "neu2-3", "module": "neu", "lesson": "neu2", "stem": "En el modelo de cinco puntos, ¿cuál corresponde a la región occipital?", "correct": "4", "options": ["4", "1", "2", "5"], "why": "El cuarto punto es occipital.", "case": false}, {"id": "neu2-4", "module": "neu", "lesson": "neu2", "stem": "¿Qué vitamina es clave para reducir el riesgo de defectos del tubo neural?", "correct": "B9 (ácido fólico)", "options": ["B9 (ácido fólico)", "B12 como única medida", "Vitamina D", "Vitamina C"], "why": "El folato se vincula con la síntesis d ica que comienza desde gastrulación. Segmentación queda como antecedente opcional. Las presentaciones aún no se han incorporado.</div>`}
