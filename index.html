function scopeQuestions(scope,arr=ALL){return arr.filter(q=>scope==='all'||(scope==='depa'&&M.get(q.module).priority)||(scope==='priority'&&PRIOR.includes(q.module))||(scope==='errors'&&currentError(q))||(scope.startsWith('lesson:')&&q.lesson===scope.slice(7))||q.module===scope)}
function scopeOptions(s,allowErr=true){const a=['depa','priority','all',...(allowErr?['errors']:[]),...D.modules.map(m=>m.id)];if(s?.startsWith('lesson:'))a.push(s);return a.map(k=>`<option value="${esc(k)}" ${s===k?'selected':''}>${esc(scopeLabel(k))}</option>`).join('')}
function exam(){let pool=scopeQuestions(state.scope).filter(q=>!state.caseOnly||q.case);return `<div class="eyebrow">Evaluación</div><h1>Simulacros y práctica</h1><p class="intro">Elige el temario, el número de preguntas y cómo quieres recibir la corrección. Las opciones y preguntas se barajan; cada sesión evita duplicados.</p>${P.exam?`<div class="notice info"><b>Sesión pendiente:</b> ${P.exam.index+1}/${P.exam.items.length}. ${btn('resume','Continuar')} ${btn('discard','Descartar sesión','','ghost')}</div>`:''}<div class="grid two section"><div class="panel"><h2>Configura tu sesión</h2><div class="config"><div class="fieldwrap" style="grid-column:1/-1"><label for="scope">Temario</label><select id="scope">${scopeOptions(state.scope)}</select></div><div class="fieldwrap"><label for="count">Preguntas</label><select id="count">${['10','20','30','40','60','all'].map(n=>`<option ${n===state.count?'selected':''} value="${n}">${n==='all'?'Todas las disponibles':n}</option>`).join('')}</select></div><div class="fieldwrap"><label for="mode">Modalidad</label><select id="mode"><option value="tutor" ${state.mode==='tutor'?'selected':''}>Tutor · corrección inmediata</option><option value="sim" ${state.mode==='sim'?'selected':''}>Simulacro · corrección final</option></select></div></div><label class="checklist"><span><input type="checkbox" id="caseOnly" ${state.caseOnly?'checked':''}> Solo casos clínicos</span></label><p class="tiny muted">${pool.length} preguntas disponibles en esta selección.</p><div class="actions">${btn('start','Comenzar sesión','','primary').replace('data-act="start"',`data-act="start" ${pool.length?'':'disabled'}`)}</div></div><div class="panel"><div class="eyebrow">Entrenamiento rápido</div><h2 style="margin-top:8px">Accesos directos</h2><div class="list" style="margin-top:14px">${btn('quick','Ojo y oído · 30 preguntas',`data-scope="priority" data-count="30" data-mode="sim"`)}${btn('quick','DEPA · 50 preguntas',`data-scope="depa" data-count="50" data-mode="sim"`)}${btn('quick','Crestas · todas las preguntas',`data-scope="cre" data-count="all" data-mode="tutor"`)}${btn('quick','Solo mis errores',`data-scope="errors" data-count="all" data-mode="tutor"`)}</div><p class="footnote">Las preguntas abiertas se califican con rúbrica de autoevaluación, no con coincidencias rígidas de texto.</p></div></div>`}
function startExam(scope=state.scope,count=state.count,mode=state.mode,only=state.caseOnly){if(P.exam&&!confirm('Ya tienes una sesión pendiente. ¿Sustituirla?'))return;let pool=scopeQuestions(scope).filter(q=>!only||q.case);if(!pool.length){alert('No hay preguntas disponibles en esta selección.');return}let qs=shuffle(pool).slice(0,count==='all'?pool.length:Math.min(Number(count)||30,pool.length));P.exam={scope,mode,index:0,items:qs.map(q=>({id:q.id,options:shuffle(q.options),chosen:null,done:false})),started:Date.now()};save();goto('session')}
function record(id,correct){let h=P.history[id]||{attempts:0,correct:0};P.history[id]={attempts:h.attempts+1,correct:h.correct+(correct?1:0),last:correct,date:new Date().toISOString()};save()}
function session(){let s=P.exam;if(!s)return exam();let it=s.items[s.index],q=Q.get(it.id),reveal=s.mode==='tutor'&&it.done;return `<div class="qpanel panel"><div class="qhead"><span class="tag">${s.mode==='tutor'?'Tutor':'Simulacro'} · ${esc(scopeLabel(s.scope))}</span><span class="tiny muted">${s.index+1} / ${s.items.length}</span></div>${progress(pct(s.items.filter(i=>i.done).length,s.items.length))}<div class="qstem">${esc(q.stem)}</div><div class="options">${it.options.map((o,i)=>`<button class="option ${it.chosen===o?'chosen':''} ${reveal&&o===q.correct?'right':''} ${reveal&&it.chosen===o&&o!==q.correct?'wrong':''}" data-act="choose" data-i="${i}" ${it.done?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>${reveal?`<div class="feedback ${it.chosen===q.correct?'right':'wrong'}"><b>${it.chosen===q.correct?'Correcto':'Respuesta correcta: '+esc(q.correct)}</b><p>${esc(q.why)}</p><p class="tiny" style="margin-top:8px">${btn('lesson', 'Revisar minibloque',attr('id',q.lesson),'ghost')}</p></div>`:''}<div class="actions">${btn('pause','Salir y guardar','','ghost')}<span class="spacer"></span>${it.done?btn('next',s.index+1===s.items.length?'Ver resultados':'Siguiente →','','primary'):btn('confirm',s.mode==='sim'?'Confirmar y continuar':'Comprobar',it.chosen===null?'disabled':'','primary')}</div></div><p class="tiny muted" style="text-align:center">${s.mode==='sim'?'No se muestran respuestas hasta terminar.':'La explicación aparece después de confirmar.'} La sesión se guarda localmente.</p>`}
function confirmAnswer(){let s=P.exam,it=s.items[s.index];if(it.done||it.chosen===null)return;it.done=true;if(s.mode==='tutor'){record(it.id,it.chosen===Q.get(it.id).correct);save();render()}else{save();advance()}}
function advance(){let s=P.exam;if(!s||!s.items[s.index].done)return;if(s.index<s.items.length-1){s.index++;save();render();window.scrollTo({top:0,behavior:'instant'});return}if(s.mode==='sim')s.items.forEach(it=>record(it.id,it.chosen===Q.get(it.id).correct));let result={scope:s.scope,items:s.items,date:new Date().toISOString(),correct:s.items.filter(it=>it.chosen===Q.get(it.id).correct).length,total:s.items.length};P.sessions.unshift({scope:result.scope,date:result.date,correct:result.correct,total:result.total});P.sessions=P.sessions.slice(0,100);P.exam=null;state.result=result;save();goto('results')}
function results(){let r=state.result;if(!r)return exam();let wrong=r.items.filter(it=>it.chosen!==Q.get(it.id).correct);let by={};r.items.forEach(it=>{let q=Q.get(it.id);let v=by[q.module]||[0,0];v[1]++;v[0]+=it.chosen===q.correct?1:0;by[q.module]=v});return `<div class="eyebrow">Resultados</div><h1>Sesión completada</h1><div class="grid two section"><div class="panel"><div class="bigscore">${(10*r.correct/r.total).toFixed(1)}<span class="muted" style="font-size:24px"> / 10</span></div><p>${r.correct} aciertos de ${r.total} · ${pct(r.correct,r.total)}%</p>${progress(pct(r.correct,r.total))}<div class="actions">${btn('practice','Repetir errores',attr('scope','errors'),'primary')}${btn('exam','Nuevo examen')}</div></div><div class="panel"><h3>Rendimiento por tema</h3>${Object.entries(by).map(([k,[a,b]])=>`<div style="margin-top:12px"><div class="sectionhead tiny" style="margin:0"><span>${esc(M.get(k).title)}</span><b>${a}/${b}</b></div>${progress(pct(a,b))}</div>`).join('')}</div></div><div class="panel section"><h2>Revisión de respuestas</h2><p class="tiny muted">${wrong.length} fallos. Se añaden a tu lista de recuperación hasta que los contestes bien.</p>${r.items.map(it=>{let q=Q.get(it.id),ok=it.chosen===q.correct;return `<div class="resultline"><h3><span style="color:${ok?'var(--good)':'var(--bad)'}">${ok?'✓':'✗'}</span> ${esc(q.stem)}</h3>${!ok?`<p>Tu respuesta: ${esc(it.chosen)}</p>`:''}<p><b>Correcta:</b> ${esc(q.correct)}</p><p>${esc(q.why)}</p>${!ok?btn('lesson','Revisar tema',attr('id',q.lesson),'ghost'):''}</div>`}).join('')}</div>`}
function errors(){let e=err();return `<div class="eyebrow">Recuperación personalizada</div><h1>Mis errores</h1><p class="intro">Aquí aparecen preguntas cuya respuesta más reciente fue incorrecta. Repite sin mirar; al acertar salen de la lista. No se mezclan con la autoevaluación de preguntas abiertas.</p><div class="panel"><div class="sectionhead"><h2>${e.length} pendientes</h2>${btn('quick','Repasar todo',`data-scope="errors" data-count="all" data-mode="tutor" ${e.length?'':'disabled'}`,'primary')}</div>${e.length?e.map(q=>`<div class="resultline"><h3>${esc(q.stem)}</h3><small>${esc(M.get(q.module).title)} · ${P.history[q.id].attempts} intento(s)</small><div class="actions">${btn('lesson','Estudiar',attr('id',q.lesson))}${btn('one','Reintentar',attr('id',q.id),'primary')}</div></div>`).join(''):'<div class="empty">No tienes errores pendientes. Contesta un simulacro para construir tu lista.</div>'}</div>`}
function recall(){if(!state.recall)state.recall={scope:'depa',id:null,text:'',show:false};let r=state.recall,pool=scopeQuestions(r.scope,OPEN);let q=Q.get(r.id);return `<div class="eyebrow">Recuperación activa</div><h1>Preguntas abiertas</h1><p class="intro">Explica con tus palabras, revela la respuesta modelo y marca qué criterios cubriste. No se utiliza una IA para adivinar si tu texto es correcto.</p><div class="panel"><div class="search"><select id="recallscope">${scopeOptions(r.scope,false)}</select>${btn('recallNext','Nueva pregunta','','primary')}</div><p class="tiny muted">${pool.length} preguntas de desarrollo disponibles.</p>${q?`<h2 style="margin:15px 0">${esc(q.stem)}</h2><textarea id="recalltext" placeholder="Escribe tu explicación antes de revelar…" ${r.show?'readonly':''}>${esc(r.text)}</textarea><div class="actions">${!r.show?btn('revealRecall','Ver respuesta y rúbrica','','primary'):''}</div>${r.show?`<div class="recallanswer"><h3>Respuesta modelo</h3><p style="margin-top:8px">${esc(q.correct)}</p><div class="checklist">${q.criteria.map((c,i)=>`<label><input type="checkbox" name="criterion" value="${i}" ${r.checked?.includes(i)?'checked':''}>${esc(c)}</label>`).join('')}</div><p id="rubricscore" class="muted">${(r.checked||[]).length}/${q.criteria.length} criterios cubiertos</p><div class="actions">${btn('saveRecall','Guardar autoevaluación','','primary')}${btn('recallNext','Otra pregunta')}</div></div>`:''}`:'<p class="empty">Selecciona un tema y pulsa Nueva pregunta.</p>'}</div>`}
function flash(){if(!state.flash)state.flash={scope:'priority',queue:[],index:0,show:false,known:0,again:[]};let f=state.flash,q=Q.get(f.queue[f.index]);return `<div class="eyebrow">Memoria activa</div><h1>Tarjetas de repaso</h1><p class="intro">Intenta responder antes de voltear. Las tarjetas difíciles vuelven a aparecer en una segunda ronda.</p><div class="panel"><div class="search"><select id="flashscope">${scopeOptions(f.scope)}</select>${btn('flashStart','Iniciar / mezclar','','primary')}</div>${q?`<div class="tiny muted">Tarjeta ${f.index+1} de ${f.queue.length} · ${esc(M.get(q.module).title)}</div><div class="panel flash" style="margin-top:12px"><div class="eyebrow">${f.show?'Respuesta':'Pregunta'}</div><div class="qstem">${esc(q.stem)}</div>${f.show?`<div class="flashanswer">${esc(q.correct)}</div><p>${esc(q.why)}</p>`:btn('flip','Voltear tarjeta','','primary')}</div><div class="actions">${f.show?btn('flashMark','No la sabía','data-ok="0"')+btn('flashMark','La sabía','data-ok="1"','primary'):''}</div>`:f.queue.length?`<div class="empty"><h2>Ronda terminada</h2><p>${f.known} recordadas · ${f.again.length} para repetir.</p>${f.again.length?btn('flashRetry','Repetir difíciles','','primary'):''}</div>`:'<div class="empty">Inicia una ronda de hasta 20 tarjetas.</div>'}</div>`}
function sequence(){let lessons=[...L.values()].filter(l=>l.sequence&&l.sequence.length>2);if(!state.sequence){let l=lessons.find(x=>x.id==='ojo1')||lessons[0];state.sequence={id:l.id,pool:shuffle(l.sequence),chosen:[],result:null}}let s=state.sequence,l=L.get(s.id);return `<div class="eyebrow">Juego de procesos</div><h1>Ordena la secuencia</h1><p class="intro">Pulsa los pasos en el orden en que ocurren. Si te equivocas, compara el orden correcto y vuelve a practicar.</p><div class="panel"><div class="fieldwrap"><label>Proceso</label><select id="sequenceSelect">${lessons.map(l=>`<option value="${l.id}" ${l.id===s.id?'selected':''}>${esc(l.title)}</option>`).join('')}</select></div><h3 style="margin-top:18px">Tu orden</h3><div class="seqanswer">${s.chosen.length?s.chosen.map((x,i)=>`<span>${i+1}. ${esc(x)}</span>`).join(''):'<span class="muted" style="background:none">Elige el primer paso.</span>'}</div><div class="chiprow">${s.pool.map((x,i)=>btn('sequencePick',esc(x),`data-i="${i}" ${s.chosen.includes(x)||s.result!==null?'disabled':''}`)).join('')}</div><div class="actions">${btn('sequenceUndo','Quitar último',s.chosen.length&&s.result===null?'':'disabled')}${btn('sequenceReset','Mezclar de nuevo')}${btn('sequenceCheck','Comprobar',s.chosen.length===l.sequence.length&&s.result===null?'':'disabled','primary')}</div>${s.result!==null?`<div class="feedback ${s.result?'right':'wrong'}"><b>${s.result?'¡Secuencia correcta!':'Revisa el orden:'}</b><div class="sequence">${l.sequence.map((x,i)=>`${i?'<span class="arrow">→</span>':''}<span class="step">${esc(x)}</span>`).join('')}</div><p style="margin-top:8px">${esc(l.tip)}</p></div>`:''}</div>`}
function progressView(){let s=stats();return `<div class="eyebrow">Seguimiento</div><h1>Mi progreso</h1><div class="grid metrics section"><div class="panel metric"><span class="muted">Estudiados</span><strong>${totalRead()}/${L.size}</strong></div><div class="panel metric"><span class="muted">Intentos</span><strong>${s.attempts}</strong></div><div class="panel metric"><span class="muted">Aciertos</span><strong>${pct(s.correct,s.attempts)}%</strong></div></div><div class="panel section"><h2>Por módulo</h2>${D.modules.map(m=>{let q=ALL.filter(x=>x.module===m.id),seen=q.filter(x=>P.history[x.id]),mastered=q.filter(x=>P.history[x.id]?.last===true);return `<div class="resultline"><div class="sectionhead"><b>${esc(m.title)}</b><small>${mastered.length}/${q.length} correctas en último intento</small></div>${progress(pct(mastered.length,q.length))}<span class="tiny muted">${seen.length} vistas · ${m.lessons.filter(x=>P.read[x.id]).length}/${m.lessons.length} minibloques</span></div>`}).join('')}</div><div class="panel section"><h2>Últimos simulacros</h2>${P.sessions.length?P.sessions.slice(0,12).map(x=>`<div class="resultline">${esc(scopeLabel(x.scope))} · <b>${x.correct}/${x.total}</b> · ${new Date(x.date).toLocaleDateString('es-MX')}</div>`).join(''):'<p class="muted" style="margin-top:12px">Aún no hay sesiones completas.</p>'}</div><div class="panel section"><h2>Tu información</h2><p class="muted">El progreso se guarda en el navegador de este dispositivo, no en una cuenta ni en la nube. En algunos visores de archivos no funciona el almacenamiento local. Exporta un respaldo para futuras versiones.</p><div class="actions">${btn('export','Exportar progreso','','primary')}${btn('import','Importar progreso')}${btn('reset','Borrar progreso','','danger')}</div><input type="file" accept="application/json,.json" id="importfile" hidden></div>`}
function sources(){return `<div class="eyebrow">Trazabilidad y alcance</div><h1>Material de clase</h1><p class="intro">20 archivos: diez pares de apuntes y transcripciones. Se integraron en nueve módulos, sin reproducir conversaciones irrelevantes. Cada minibloque indica sus páginas de referencia. No se incorporaron presentaciones no recibidas, ni material de otras materias.</p><div class="panel"><h2>Inventario</h2>${Object.values(D.sources).map(s=>`<div class="sourceitem"><b>${esc(s.title)} · ${s.date}</b><ul>${s.files.map(f=>`<li>${esc(f.name)} · ${f.pages} páginas</li>`).join('')}</ul></div>`).join('')}</div><div class="panel section"><h2>Discrepancias y límites</h2><p class="intro">El contenido conserva la nomenclatura docente y marca las simplificaciones o inconsistencias que pueden afectar un examen. No se convierten datos dudosos en preguntas de respuesta única.</p>${[...L.values()].filter(l=>l.alert).map(l=>`<div class="resultline"><h3>${esc(l.title)}</h3><p>${esc(l.alert)}</p>${btn('lesson','Ir al tema',attr('id',l.id),'ghost')}</div>`).join('')}</div><div class="notice info">Material educativo de primer semestre, no guía clínica ni banco oficial de preguntas. Las preguntas son originales, elaboradas a partir de los archivos de clase.</div>`}
function render(){document.getElementById('nav').innerHTML=navItems.map(([id,i,t])=>`<button data-act="${id}" class="${state.view===id||(state.view==='lesson'&&id==='modules')||(['session','results'].includes(state.view)&&id==='exam')?'active':''}"><span class="ni">${i}</span>${t}</button>`).join('');document.getElementById('crumb').innerHTML=`Embriología <span class="muted">/</span> <b>${esc(state.view==='lesson'?L.get(state.lesson).title:navItems.find(x=>x[0]===state.view)?.[2]||'Evaluación')}</b>`;document.getElementById('topstat').textContent=`${totalRead()}/${L.size} estudiados`;let views={home,modules,lesson,exam,session,results,errors,recall,flash,sequence,progress:progressView,sources};app.innerHTML=(views[state.view]||home)()+(!storageOK?'<div class="notice">El almacenamiento local no está disponible en este visor. Exporta tu progreso antes de cerrar.</div>':'');if(state.view==='modules'){document.getElementById('filter').value=state.filter} }
function updateScope(s){state.scope=s;state.caseOnly=false;goto('exam')}
function setSequence(id){let l=L.get(id);state.sequence={id,pool:shuffle(l.sequence),chosen:[],result:null};render()}
function recallNext(){let r=state.recall;let qs=scopeQuestions(r.scope,OPEN);let pool=qs.filter(q=>q.id!==r.id);let q=shuffle(pool.length?pool:qs)[0];state.recall={scope:r.scope,id:q?.id||null,text:'',show:false,checked:[]};render()}
function flashStart(){let f=state.flash;f.queue=shuffle(scopeQuestions(f.scope)).slice(0,20).map(q=>q.id);f.index=0;f.show=false;f.known=0;f.again=[];render()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b||b.disabled)return;let a=b.dataset.act,id=b.dataset.id;
if(navItems.some(x=>x[0]===a)){if(a==='recall'&&!state.recall)state.recall={scope:'depa'};goto(a);return}
switch(a){case'menu':document.getElementById('side').classList.toggle('open');break;case'priority':state.filter='priority';state.search='';goto('modules');break;case'module':openLesson(M.get(id).lessons[0].id);break;case'lesson':openLesson(id);break;case'read':P.read[id]=!P.read[id];save();render();break;case'practice':updateScope(b.dataset.scope);break;case'quick':startExam(b.dataset.scope,b.dataset.count,b.dataset.mode,false);break;case'start':startExam();break;case'resume':goto('session');break;case'discard':if(confirm('¿Descartar la sesión pendiente?')){P.exam=null;save();render()}break;case'choose':if(!P.exam.items[P.exam.index].done){let it=P.exam.items[P.exam.index];it.chosen=it.options[Number(b.dataset.i)];save();render()}break;case'confirm':confirmAnswer();break;case'next':advance();break;case'pause':goto('exam');break;case'one':if(P.exam&&!confirm('¿Sustituir la sesión pendiente?'))break;{let q=Q.get(id);P.exam={scope:'errors',mode:'tutor',index:0,items:[{id,options:shuffle(q.options),chosen:null,done:false}],started:Date.now()};save();goto('session')}break;
case'openRecall':state.recall={scope:b.dataset.scope,id:null,text:'',show:false};state.view='recall';recallNext();goto('recall');break;case'recallNext':recallNext();break;case'revealRecall':state.recall.show=true;state.recall.checked=[];render();break;case'saveRecall':{let r=state.recall,q=Q.get(r.id);P.recall[r.id]={covered:r.checked.length,total:q.criteria.length,text:r.text,date:new Date().toISOString()};save();b.textContent='✓ Autoevaluación guardada';break}case'flashStart':flashStart();break;case'flip':state.flash.show=true;render();break;case'flashMark':{let f=state.flash;if(b.dataset.ok==='1')f.known++;else f.again.push(f.queue[f.index]);f.index++;f.show=false;render();break}case'flashRetry':{let f=state.flash;f.queue=shuffle(f.again);f.again=[];f.index=0;f.known=0;f.show=false;render();break}case'sequencePick':state.sequence.chosen.push(state.sequence.pool[Number(b.dataset.i)]);render();break;case'sequenceUndo':state.sequence.chosen.pop();render();break;case'sequenceReset':setSequence(state.sequence.id);break;case'sequenceCheck':{let s=state.sequence;s.result=s.chosen.every((x,i)=>x===L.get(s.id).sequence[i]);render();break}case'export':{let url=URL.createObjectURL(new Blob([JSON.stringify(P,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='trama-progreso.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);break}case'import':document.getElementById('importfile').click();break;case'reset':if(confirm('¿Borrar progreso, notas, sesiones y errores?')){P=initial();save();goto('progress')}break;}});
document.addEventListener('change',async e=>{let t=e.target;switch(t.id){case'filter':state.filter=t.value;render();break;case'scope':state.scope=t.value;render();break;case'count':state.count=t.value;render();break;case'mode':state.mode=t.value;render();break;case'caseOnly':state.caseOnly=t.checked;render();break;case'recallscope':state.recall={scope:t.value,id:null,text:'',show:false};render();break;case'flashscope':state.flash={scope:t.value,queue:[],index:0,show:false,known:0,again:[]};render();break;case'sequenceSelect':setSequence(t.value);break;case'importfile':try{let v=JSON.parse(await t.files[0].text());if(!v||typeof v.read!=='object'||typeof v.history!=='object'||!Array.isArray(v.sessions)||!v.read||!v.history)throw Error('invalid');let p=initial();for(let [k,vv] of Object.entries(v.read))if(L.has(k))p.read[k]=Boolean(vv);for(let [k,h] of Object.entries(v.history))if(Q.has(k)&&h&&Number.isInteger(h.attempts)&&h.attempts>=0&&Number.isInteger(h.correct)&&h.correct>=0&&h.correct<=h.attempts)p.history[k]={attempts:h.attempts,correct:h.correct,last:h.last===true,date:String(h.date||'')};for(let [k,n] of Object.entries(v.notes||{}))if(L.has(k)&&typeof n==='string')p.notes[k]=n;p.sessions=v.sessions.filter(x=>x&&Number.isFinite(x.correct)&&Number.isFinite(x.total)&&x.total>0&&x.correct>=0&&x.correct<=x.total&&typeof x.scope==='string').slice(0,100);p.recall=v.recall&&typeof v.recall==='object'?v.recall:{};if(confirm('¿Reemplazar el progreso local con este respaldo?')){P=p;save();goto('progress')}}catch(e){alert('El respaldo no es válido.')}break;default:if(t.name==='criterion'){state.recall.checked=[...document.querySelectorAll('[name=criterion]:checked')].map(x=>Number(x.value));document.getElementById('rubricscore').textContent=`${state.recall.checked.length}/${Q.get(state.recall.id).criteria.length} criterios cubiertos`}}});
document.addEventListener('input',e=>{let t=e.target;if(t.id==='search'){let pos=t.selectionStart;state.search=t.value;render();let n=document.getElementById('search');n.focus();try{n.setSelectionRange(pos,pos)}catch{}}else if(t.id==='notes'){P.notes[state.lesson]=t.value;save()}else if(t.id==='recalltext')state.recall.text=t.value});
